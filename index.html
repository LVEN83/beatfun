<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>LET'S GO</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(12px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
      background-color: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: opacity 1s ease;
    }

    .app.vanishing {
      opacity: 0;
    }

    .hidden {
      display: none !important;
    }

    .mono {
      font-family: "Courier New", Courier, monospace;
    }

    button {
      touch-action: manipulation;
      outline: none;
    }

    /* ---------- START SCREEN ---------- */
    .start-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff;
    }

    .btn-lets-go {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      min-width: 220px;
      min-height: 68px;
      padding: 20px 44px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-lets-go:active {
      background-color: #ffffff;
      color: #000000;
    }

    /* ---------- SEQUENCER SCREEN (PORTRAIT 4x4) ---------- */
    .seq-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ffffff;
      padding: 12px 14px;
      min-height: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #333333;
      padding-bottom: 8px;
    }

    .inst-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
    }

    .bpm-box {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #333333;
      padding: 0 10px;
      height: 48px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* 32-step Page Switcher for Chords (1-16 / 17-32) */
    .page-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .page-btn {
      min-height: 48px;
      background-color: #000000;
      color: #777777;
      border: 1px solid #333333;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .page-btn.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .page-dot {
      width: 6px;
      height: 6px;
      background-color: transparent;
    }

    .page-btn.playing .page-dot {
      background-color: #ffffff;
    }

    .page-btn.active.playing .page-dot {
      background-color: #000000;
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      touch-action: none;
      margin: 4px 0;
    }

    .step-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .step-pad {
      width: 100%;
      min-height: 48px;
      height: clamp(48px, 7.2dvh, 64px);
      background-color: #000000;
      border: 1px solid #3a3a3a;
      color: #666666;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .seq-screen.chords-32 .step-pad {
      height: clamp(48px, 6.2dvh, 56px);
    }

    .step-pad.beat-mark {
      border-left: 3px solid #777777;
    }

    .step-pad.active {
      background-color: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .playhead-bar {
      width: 100%;
      height: 3px;
      background-color: #1a1a1a;
    }

    .playhead-bar.now {
      background-color: #ffffff;
    }

    .params-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .param-box {
      border: 1px solid #333333;
      padding: 5px 12px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .param-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .param-label {
      color: #999999;
    }

    .param-value {
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      margin: 0;
      background: transparent;
      outline: none;
      touch-action: pan-x;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: #444444;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -10px;
      background: #ffffff;
      border: none;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
      padding-top: 4px;
    }

    .btn-secondary {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #555555;
      min-height: 48px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-secondary:active {
      border-color: #ffffff;
      background-color: #222222;
    }

    .btn-next {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      min-height: 48px;
      padding: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-next:active {
      background-color: #000000;
      color: #ffffff;
    }

    /* ---------- NOTE / CHORD PICKER POPUP ---------- */
    .note-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      touch-action: none;
    }

    .note-modal {
      width: 100%;
      max-width: 390px;
      background-color: #000000;
      border: 1px solid #ffffff;
      padding: 14px;
    }

    .note-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .note-close-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #555555;
      width: 48px;
      height: 48px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .note-close-btn:active {
      background: #ffffff;
      color: #000000;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .note-grid.chords-mode {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .note-btn {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #444444;
      min-height: 48px;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .note-grid.chords-mode .note-btn {
      min-height: 50px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .note-btn:active {
      border-color: #ffffff;
    }

    .note-btn.selected {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .note-remove-btn {
      width: 100%;
      min-height: 48px;
      background-color: #000000;
      color: #999999;
      border: 1px solid #444444;
      padding: 10px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .note-remove-btn:active {
      color: #ffffff;
      border-color: #ffffff;
    }

    /* ---------- FINALE SCREEN ---------- */
    .finale-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ffffff;
      padding: 14px;
      min-height: 0;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background-color: #222222;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #ffffff;
    }

    .monitor-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pixel-monitor {
      border: 1px solid #ffffff;
      padding: 5px;
      background-color: #000000;
      display: inline-block;
    }

    .pixel-canvas {
      display: block;
      width: clamp(120px, 21dvh, 176px);
      height: clamp(120px, 21dvh, 176px);
      background-color: #000000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .vinyls-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 16px;
    }

    .vinyl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .vinyl-canvas {
      display: block;
      width: clamp(112px, 18dvh, 140px);
      height: clamp(112px, 18dvh, 140px);
      cursor: pointer;
      touch-action: none;
    }

    .vinyl-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666666;
    }

    .vinyl-label.active {
      color: #ffffff;
    }

    .matrix {
      border: 1px solid #333333;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .matrix-row {
      display: grid;
      grid-template-columns: 74px repeat(16, 1fr);
      gap: 2px;
      align-items: center;
    }

    .matrix-row.row-32 {
      grid-template-columns: 74px repeat(32, 1fr);
      gap: 1px;
    }

    .matrix-name {
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaaaaa;
      white-space: nowrap;
      overflow: hidden;
    }

    .matrix-cell {
      height: 11px;
      border: 1px solid #262626;
      background-color: #000000;
    }

    .matrix-cell.on {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .matrix-cell.now {
      outline: 1.5px solid #ffffff;
    }

    @media (hover: hover) {
      .btn-lets-go:hover { background-color: #ffffff; color: #000000; }
      .step-pad:hover { border-color: #ffffff; }
      .btn-secondary:hover { border-color: #ffffff; }
      .btn-next:hover { background-color: #000000; color: #ffffff; }
      .note-btn:hover { border-color: #ffffff; }
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <!-- START SCREEN -->
    <div id="startScreen" class="start-screen">
      <button type="button" class="btn-lets-go" id="startBtn">LET'S GO</button>
    </div>

    <!-- SEQUENCER SCREEN -->
    <div id="sequencerScreen" class="seq-screen hidden">
      <div class="top-bar">
        <h2 class="inst-name" id="instName">BASS DRUM</h2>

        <div class="bpm-box mono">
          <span>BPM</span>
          <input type="range" id="bpmSlider" min="75" max="155" value="118" style="width: 82px;" />
          <span id="bpmValue">118</span>
        </div>
      </div>

      <!-- 32-STEP BAR SWITCHER (CHORDS ONLY) -->
      <div class="page-bar hidden" id="chordPageBar">
        <button type="button" class="page-btn mono active" id="pageBtn0">
          <span class="page-dot"></span><span>1 – 16</span>
        </button>
        <button type="button" class="page-btn mono" id="pageBtn1">
          <span class="page-dot"></span><span>17 – 32</span>
        </button>
      </div>

      <div class="step-grid" id="stepGrid"></div>

      <div class="params-grid">
        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label">Pitch</span>
            <span class="param-value" id="pitchVal">50%</span>
          </div>
          <input type="range" id="pitchSlider" min="0" max="1" step="0.01" value="0.5" />
        </div>

        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label">Decay</span>
            <span class="param-value" id="decayVal">300 ms</span>
          </div>
          <input type="range" id="decaySlider" min="0" max="1" step="0.01" value="0.5" />
        </div>

        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label">Lowpass</span>
            <span class="param-value" id="filterVal">8.0 kHz</span>
          </div>
          <input type="range" id="filterSlider" min="0" max="1" step="0.01" value="0.85" />
        </div>
      </div>

      <div class="actions-row">
        <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
        <button type="button" class="btn-next" id="nextBtn">Hi-Hats →</button>
      </div>
    </div>

    <!-- 30-SECOND FINALE SCREEN -->
    <div id="finaleScreen" class="finale-screen hidden">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="monitor-center">
        <div class="pixel-monitor">
          <canvas class="pixel-canvas" id="pixelCanvas" width="32" height="32"></canvas>
        </div>
      </div>

      <div class="vinyls-row">
        <div class="vinyl-wrap">
          <canvas class="vinyl-canvas" id="leftVinyl" width="144" height="144"></canvas>
          <span class="vinyl-label mono" id="leftVinylLabel">REWIND</span>
        </div>

        <div class="vinyl-wrap">
          <canvas class="vinyl-canvas" id="rightVinyl" width="144" height="144"></canvas>
          <span class="vinyl-label mono" id="rightVinylLabel">HIGHPASS</span>
        </div>
      </div>

      <div class="matrix" id="matrix"></div>
    </div>
  </div>

  <!-- NOTE / CHORD PICKER MODAL -->
  <div id="noteModalBackdrop" class="note-modal-backdrop hidden">
    <div class="note-modal" id="noteModal">
      <div class="note-modal-head mono">
        <span id="noteModalTitle">STEP 01</span>
        <button type="button" class="note-close-btn" id="noteCloseBtn">×</button>
      </div>
      <div class="note-grid" id="noteGrid"></div>
      <button type="button" class="note-remove-btn mono" id="noteRemoveBtn">Remove Step</button>
    </div>
  </div>

  <script>
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      e.preventDefault();
    }, { passive: false });

    var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function midiToHz(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function midiToLabel(midi) {
      var oct = Math.floor(midi / 12) - 1;
      return NOTE_NAMES[((midi % 12) + 12) % 12] + oct;
    }

    function buildNoteRange(startMidi, endMidi) {
      var list = [];
      for (var m = startMidi; m <= endMidi; m++) {
        list.push({ name: midiToLabel(m), midi: m });
      }
      return list;
    }

    var BASS_NOTES = buildNoteRange(24, 36); // C1 to C2

    // 10 harmonious mixed chords (Maj7, 6/9, m7, m9, Sus4) in C Major / A Minor, all between C2 (36) and C4 (60)
    var CHORDS = [
      { name: 'Cmaj7', notes: [48, 52, 55, 59] },
      { name: 'C6/9',  notes: [48, 52, 55, 57] },
      { name: 'Dm7',   notes: [50, 53, 57, 60] },
      { name: 'Dm9',   notes: [38, 48, 53, 57] },
      { name: 'Em7',   notes: [40, 47, 50, 55] },
      { name: 'Fmaj7', notes: [41, 48, 52, 57] },
      { name: 'F6/9',  notes: [41, 45, 48, 55] },
      { name: 'G6',    notes: [43, 47, 50, 52] },
      { name: 'Gsus4', notes: [43, 48, 50, 55] },
      { name: 'Am9',   notes: [45, 52, 55, 59] }
    ];

    var INSTRUMENTS = [
      { id: 'kick',     name: 'Bass Drum',  steps: 16, defaults: { pitch: 0.45, decay: 0.55, filter: 0.78 }, pitchRange: [42, 115],    decayRange: [0.12, 0.75] },
      { id: 'hihat',    name: 'Hi-Hats',    steps: 16, defaults: { pitch: 0.55, decay: 0.25, filter: 0.90 }, pitchRange: [0.6, 1.8],   decayRange: [0.03, 0.35] },
      { id: 'tom',      name: 'Toms',       steps: 16, defaults: { pitch: 0.50, decay: 0.45, filter: 0.80 }, pitchRange: [75, 240],    decayRange: [0.10, 0.65] },
      { id: 'maracas',  name: 'Maracas',    steps: 16, defaults: { pitch: 0.50, decay: 0.38, filter: 0.88 }, pitchRange: [0.65, 1.55], decayRange: [0.045, 0.24] },
      { id: 'snare',    name: 'Snare Drum', steps: 16, defaults: { pitch: 0.48, decay: 0.40, filter: 0.85 }, pitchRange: [130, 290],   decayRange: [0.08, 0.50] },
      { id: 'bassline', name: 'Bassline',   steps: 16, defaults: { pitch: 0.50, decay: 0.45, filter: 0.70 }, pitchRange: [-12, 12],    decayRange: [0.08, 0.60] },
      { id: 'chords',   name: 'Chords',     steps: 32, defaults: { pitch: 0.50, decay: 0.70, filter: 0.62 }, pitchRange: [-25, 25],    decayRange: [0.15, 2.0] }
    ];

    var CYCLE_STEPS = 32; // Master clock runs 32 steps so Chords spans 2 bars while 16-step instruments loop twice
    var FINALE_SECONDS = 30;
    var BASE_HPF_HZ = 35;
    var REWIND_SPEED = -0.5;

    var turnIndex = 0;
    var chordPage = 0; // 0 = steps 1..16, 1 = steps 17..32
    var bpm = 118;
    var isPlaying = false;
    var finaleActive = false;
    var tracks = [];
    var lastChosenBassNoteIdx = 0;
    var lastChosenChordIdx    = 0;

    function resetTracks() {
      tracks = [];
      for (var i = 0; i < INSTRUMENTS.length; i++) {
        var inst = INSTRUMENTS[i];
        var arr = [];
        var noteArr = [];
        for (var s = 0; s < inst.steps; s++) {
          arr.push(false);
          noteArr.push(0);
        }
        tracks.push({
          steps: arr,
          notes: noteArr,
          params: {
            pitch: inst.defaults.pitch,
            decay: inst.defaults.decay,
            filter: inst.defaults.filter
          }
        });
      }
      lastChosenBassNoteIdx = 0;
      lastChosenChordIdx = 0;
      chordPage = 0;
    }
    resetTracks();

    // ---------------------------------------------------------
    // WEB AUDIO ENGINE
    // ---------------------------------------------------------
    var audioCtx = null;
    var audioUnlocked = false;
    var mixBus = null;
    var dryMixGain = null;

    var chordOscs = [];
    var chordLPF = null;
    var chordGain = null;
    var chordHasPlayed = false;
    var chordReverbConvolver = null;
    var chordReverbLPF = null;
    var chordReverbWet = null;

    var snareGritShaper = null;

    var rewindProcessor = null;
    var rewindLPF = null;
    var rewindOutGain = null;
    var ringBuf = null;
    var ringLen = 0;
    var ringWriteIdx = 0;
    var rewindTopIdx = 0;
    var rewindLoopSpan = 0;
    var rewindCursor = 0;
    var rewindActive = false;

    var lastHitAudioTime = -1;
    var prevHitAudioTime = -1;

    var masterHPF = null;
    var hpfReverbSend = null;
    var reverbConvolver = null;
    var reverbToneLPF = null;
    var hpfReverbWet = null;
    var masterCompressor = null;
    var masterGain = null;
    var noiseBuffer = null;

    var hpfActive = false;
    var activePlayStep = 0;
    var currentStep = 0;
    var nextNoteTime = 0;
    var schedulerId = null;
    var visualQueue = [];

    function createReverbImpulse(ctx, durationSec, decayPow) {
      var len = Math.floor(ctx.sampleRate * durationSec);
      var impulse = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var ch = 0; ch < 2; ch++) {
        var data = impulse.getChannelData(ch);
        for (var i = 0; i < len; i++) {
          var env = Math.pow(1 - i / len, decayPow);
          data[i] = (Math.random() * 2 - 1) * env;
        }
      }
      return impulse;
    }

    function create909GritCurve() {
      var n = 2048, curve = new Float32Array(n);
      for (var i = 0; i < n; i++) {
        var x = (i * 2) / (n - 1) - 1;
        curve[i] = Math.round(x * 24) / 24;
      }
      return curve;
    }

    function readRingLinear(pos) {
      var idx0 = Math.floor(pos);
      var frac = pos - idx0;
      var i0 = ((idx0 % ringLen) + ringLen) % ringLen;
      var i1 = (i0 + 1) % ringLen;
      return ringBuf[i0] * (1 - frac) + ringBuf[i1] * frac;
    }

    function initAndUnlockAudio() {
      if (navigator.audioSession) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }

      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();

        mixBus = audioCtx.createGain();
        mixBus.gain.value = 0.65;

        dryMixGain = audioCtx.createGain();
        dryMixGain.gain.value = 1.0;

        snareGritShaper = audioCtx.createWaveShaper();
        snareGritShaper.curve = create909GritCurve();
        snareGritShaper.oversample = 'none';

        chordReverbConvolver = audioCtx.createConvolver();
        chordReverbConvolver.buffer = createReverbImpulse(audioCtx, 1.5, 2.7);

        chordReverbLPF = audioCtx.createBiquadFilter();
        chordReverbLPF.type = 'lowpass';
        chordReverbLPF.frequency.value = 3000;

        chordReverbWet = audioCtx.createGain();
        chordReverbWet.gain.value = 0.20;

        chordReverbConvolver.connect(chordReverbLPF);
        chordReverbLPF.connect(chordReverbWet);
        chordReverbWet.connect(mixBus);

        chordLPF = audioCtx.createBiquadFilter();
        chordLPF.type = 'lowpass';
        chordLPF.frequency.value = normToFilterHz(INSTRUMENTS[6].defaults.filter);
        chordLPF.Q.value = 0.7;

        chordGain = audioCtx.createGain();
        chordGain.gain.value = 0.0;

        chordGain.connect(chordLPF);
        chordLPF.connect(mixBus);
        chordLPF.connect(chordReverbConvolver);

        chordOscs = [];
        for (var v = 0; v < 4; v++) {
          var osc = audioCtx.createOscillator();
          osc.type = v === 0 ? 'triangle' : 'sine';
          osc.frequency.value = midiToHz(CHORDS[0].notes[v]);
          osc.detune.value = (v - 1.5) * 4;
          var vg = audioCtx.createGain();
          vg.gain.value = 0.25;
          osc.connect(vg);
          vg.connect(chordGain);
          osc.start(0);
          chordOscs.push(osc);
        }

        masterHPF = audioCtx.createBiquadFilter();
        masterHPF.type = 'highpass';
        masterHPF.frequency.value = BASE_HPF_HZ;
        masterHPF.Q.value = 0.7;

        hpfReverbSend = audioCtx.createGain();
        hpfReverbSend.gain.value = 0.0;

        reverbConvolver = audioCtx.createConvolver();
        reverbConvolver.buffer = createReverbImpulse(audioCtx, 1.4, 3.0);

        reverbToneLPF = audioCtx.createBiquadFilter();
        reverbToneLPF.type = 'lowpass';
        reverbToneLPF.frequency.value = 5200;

        hpfReverbWet = audioCtx.createGain();
        hpfReverbWet.gain.value = 0.0;

        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.setValueAtTime(-10, audioCtx.currentTime);
        masterCompressor.knee.setValueAtTime(12, audioCtx.currentTime);
        masterCompressor.ratio.setValueAtTime(12, audioCtx.currentTime);
        masterCompressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
        masterCompressor.release.setValueAtTime(0.12, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.90;

        mixBus.connect(dryMixGain);
        dryMixGain.connect(masterHPF);

        try {
          ringLen = audioCtx.sampleRate * 6;
          ringBuf = new Float32Array(ringLen);
          ringWriteIdx = 0;

          rewindProcessor = audioCtx.createScriptProcessor(2048, 1, 1);
          rewindProcessor.onaudioprocess = function(e) {
            var inp = e.inputBuffer.getChannelData(0);
            var out = e.outputBuffer.getChannelData(0);
            var len = inp.length;

            if (!rewindActive) {
              for (var i = 0; i < len; i++) {
                ringBuf[ringWriteIdx] = inp[i];
                ringWriteIdx = (ringWriteIdx + 1) % ringLen;
                out[i] = 0;
              }
              return;
            }

            var fadeN = 256;
            for (var j = 0; j < len; j++) {
              var s = readRingLinear(rewindTopIdx - rewindLoopSpan + rewindCursor);
              if (rewindCursor < fadeN) {
                var mix = rewindCursor / fadeN;
                var wrapS = readRingLinear(rewindTopIdx + rewindCursor);
                s = wrapS * (1 - mix) + s * mix;
              }
              out[j] = s;

              rewindCursor += REWIND_SPEED;
              if (rewindCursor < 0) {
                rewindCursor += rewindLoopSpan;
              }
            }
          };

          rewindLPF = audioCtx.createBiquadFilter();
          rewindLPF.type = 'lowpass';
          rewindLPF.frequency.value = 6000;
          rewindLPF.Q.value = 0.7;

          rewindOutGain = audioCtx.createGain();
          rewindOutGain.gain.value = 0.0;

          mixBus.connect(rewindProcessor);
          rewindProcessor.connect(rewindLPF);
          rewindLPF.connect(rewindOutGain);
          rewindOutGain.connect(masterHPF);
        } catch (err) {
          rewindProcessor = null;
        }

        masterHPF.connect(masterCompressor);

        masterHPF.connect(hpfReverbSend);
        hpfReverbSend.connect(reverbConvolver);
        reverbConvolver.connect(reverbToneLPF);
        reverbToneLPF.connect(hpfReverbWet);
        hpfReverbWet.connect(masterCompressor);

        masterCompressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        var len = audioCtx.sampleRate;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        var ch = noiseBuffer.getChannelData(0);
        for (var i = 0; i < len; i++) {
          ch[i] = Math.random() * 2 - 1;
        }
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(function() {
          if (isPlaying && audioCtx) {
            nextNoteTime = audioCtx.currentTime + 0.03;
          }
        }).catch(function() {});
      }

      if (!audioUnlocked) {
        try {
          var silentBuf = audioCtx.createBuffer(1, 1, 22050);
          var silentSrc = audioCtx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(audioCtx.destination);
          silentSrc.start(0);
          if (audioCtx.state === 'running') {
            audioUnlocked = true;
          }
        } catch (e) {}
      }
    }

    function ensureAudioUnlocked() {
      if (audioCtx && audioCtx.state !== 'running') {
        initAndUnlockAudio();
      }
    }
    document.addEventListener('touchend', ensureAudioUnlocked, true);
    document.addEventListener('click', ensureAudioUnlocked, true);
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    function silenceChordSynth() {
      if (!audioCtx || !chordGain) return;
      var now = audioCtx.currentTime;
      chordGain.gain.cancelScheduledValues(now);
      chordGain.gain.setTargetAtTime(0.0, now, 0.02);
      chordHasPlayed = false;
    }

    function setRewind(on) {
      if (rewindActive === on) return;
      rewindActive = on;
      leftVinylLabel.classList.toggle('active', on);
      if (!audioCtx || !dryMixGain || !rewindOutGain || !rewindProcessor) return;

      var now = audioCtx.currentTime;
      if (on) {
        var sr = audioCtx.sampleRate;
        var barSamples = Math.round((240 / bpm) * sr);
        rewindLoopSpan = Math.min(ringLen - 1024, Math.max(2048, barSamples));
        rewindTopIdx = (ringWriteIdx - 256 + ringLen) % ringLen;

        var refHit = lastHitAudioTime;
        if (refHit > now - 0.035 && prevHitAudioTime > 0) {
          refHit = prevHitAudioTime;
        }
        var backSamples = 0;
        if (refHit > 0 && (now - refHit) < (rewindLoopSpan / sr)) {
          var hitAgeSamples = Math.round((now - refHit) * sr);
          var tailOffset = Math.round(0.11 * sr);
          backSamples = Math.max(0, Math.min(rewindLoopSpan - 512, hitAgeSamples - tailOffset));
        }

        rewindCursor = Math.max(256, rewindLoopSpan - backSamples);

        dryMixGain.gain.setTargetAtTime(0.0, now, 0.005);
        rewindOutGain.gain.setTargetAtTime(1.12, now, 0.005);
      } else {
        rewindOutGain.gain.setTargetAtTime(0.0, now, 0.008);
        dryMixGain.gain.setTargetAtTime(1.0, now, 0.008);
      }
    }

    function triggerHpfNoiseBurst() {
      if (!audioCtx || !noiseBuffer || !masterHPF) return;
      var now = audioCtx.currentTime;

      var src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;

      var bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(900, now);
      bp.frequency.exponentialRampToValueAtTime(3400, now + 0.28);
      bp.Q.value = 1.1;

      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.11, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

      src.connect(bp);
      bp.connect(g);
      g.connect(masterHPF);

      src.start(now);
      src.stop(now + 0.36);
    }

    function setHighPass(on) {
      if (hpfActive === on) return;
      hpfActive = on;
      rightVinylLabel.classList.toggle('active', on);
      if (!audioCtx || !masterHPF) return;

      var now = audioCtx.currentTime;
      masterHPF.frequency.cancelScheduledValues(now);
      masterHPF.frequency.setValueAtTime(Math.max(BASE_HPF_HZ, masterHPF.frequency.value), now);

      if (on) {
        masterHPF.frequency.exponentialRampToValueAtTime(700, now + 0.28);
        masterHPF.Q.setTargetAtTime(1.6, now, 0.04);
        hpfReverbWet.gain.setTargetAtTime(0.32, now, 0.03);
        hpfReverbSend.gain.setTargetAtTime(0.40, now, 0.05);
        triggerHpfNoiseBurst();
      } else {
        masterHPF.frequency.exponentialRampToValueAtTime(BASE_HPF_HZ, now + 0.10);
        masterHPF.Q.setTargetAtTime(0.7, now, 0.04);
        hpfReverbSend.gain.setTargetAtTime(0.0, now, 0.02);
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function normToFilterHz(t) {
      return 120 * Math.pow(18000 / 120, t);
    }

    function normToBassFilterHz(t) {
      return 45 * Math.pow(900 / 45, t);
    }

    function getMaxChordsDecaySec() {
      return 240 / bpm;
    }

    function getRawDecaySec(inst, decayParam) {
      if (inst.id === 'chords') {
        return lerp(0.15, getMaxChordsDecaySec(), decayParam);
      }
      return lerp(inst.decayRange[0], inst.decayRange[1], decayParam);
    }

    function triggerSound(instIdx, stepIdx, time) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      var inst = INSTRUMENTS[instIdx];
      var p = tracks[instIdx].params;
      var pitchVal = lerp(inst.pitchRange[0], inst.pitchRange[1], p.pitch);
      var decayVal = getRawDecaySec(inst, p.decay);
      var cutoff = inst.id === 'bassline' ? normToBassFilterHz(p.filter) : normToFilterHz(p.filter);

      if (inst.id === 'chords') {
        var chordIdx = tracks[instIdx].notes[stepIdx] || 0;
        if (chordIdx < 0 || chordIdx >= CHORDS.length) chordIdx = 0;
        var chordNotes = CHORDS[chordIdx].notes;

        chordLPF.frequency.setTargetAtTime(cutoff, time, 0.015);

        var glideFromPrev = chordHasPlayed;
        for (var v = 0; v < 4; v++) {
          var targetHz = midiToHz(chordNotes[v]);
          chordOscs[v].detune.setTargetAtTime(pitchVal + (v - 1.5) * 4, time, 0.015);
          if (glideFromPrev) {
            chordOscs[v].frequency.setTargetAtTime(targetHz, time, 0.045);
          } else {
            chordOscs[v].frequency.setValueAtTime(targetHz, time);
          }
        }
        chordHasPlayed = true;

        var sustainUntil = time + decayVal * 0.72;
        var releaseTau = Math.max(0.025, decayVal * 0.10);

        chordGain.gain.cancelScheduledValues(time);
        chordGain.gain.setTargetAtTime(0.32, time, 0.028);
        chordGain.gain.setTargetAtTime(0.0, sustainUntil, releaseTau);
        return;
      }

      var lpf = audioCtx.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.setValueAtTime(cutoff, time);
      lpf.Q.value = 0.7;
      lpf.connect(mixBus);

      if (inst.id === 'kick') {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitchVal * 2.8, time);
        osc.frequency.exponentialRampToValueAtTime(pitchVal, time + Math.min(0.055, decayVal * 0.6));
        g.gain.setValueAtTime(0.0001, time);
        g.gain.linearRampToValueAtTime(0.68, time + 0.003);
        g.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        g.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);
        osc.connect(g);
        g.connect(lpf);
        osc.start(time);
        osc.stop(time + decayVal + 0.015);
      } else if (inst.id === 'hihat') {
        var hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(4500 * pitchVal, time);
        hp.connect(lpf);

        var noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        var ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.30, time);
        ng.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        ng.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);
        noise.connect(ng);
        ng.connect(hp);
        noise.start(time);
        noise.stop(time + decayVal + 0.012);

        var ratios = [2, 3.1, 4.2, 5.4, 6.8];
        var mg = audioCtx.createGain();
        mg.gain.setValueAtTime(0.14, time);
        mg.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        mg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);
        mg.connect(hp);
        for (var i = 0; i < ratios.length; i++) {
          var ho = audioCtx.createOscillator();
          ho.type = 'square';
          ho.frequency.setValueAtTime(260 * pitchVal * ratios[i], time);
          ho.connect(mg);
          ho.start(time);
          ho.stop(time + decayVal + 0.012);
        }
      } else if (inst.id === 'tom') {
        var tosc = audioCtx.createOscillator();
        var tg = audioCtx.createGain();
        tosc.type = 'sine';
        tosc.frequency.setValueAtTime(pitchVal * 1.75, time);
        tosc.frequency.exponentialRampToValueAtTime(pitchVal, time + Math.min(0.08, decayVal * 0.6));
        tg.gain.setValueAtTime(0.0001, time);
        tg.gain.linearRampToValueAtTime(0.52, time + 0.003);
        tg.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        tg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);
        tosc.connect(tg);
        tg.connect(lpf);
        tosc.start(time);
        tosc.stop(time + decayVal + 0.015);
      } else if (inst.id === 'maracas') {
        var mNoise = audioCtx.createBufferSource();
        mNoise.buffer = noiseBuffer;

        var mHP = audioCtx.createBiquadFilter();
        mHP.type = 'highpass';
        mHP.frequency.setValueAtTime(3200 * pitchVal, time);

        var mBP = audioCtx.createBiquadFilter();
        mBP.type = 'bandpass';
        mBP.frequency.setValueAtTime(6200 * pitchVal, time);
        mBP.Q.value = 1.6;

        var mPeak = audioCtx.createBiquadFilter();
        mPeak.type = 'peaking';
        mPeak.frequency.setValueAtTime(8800 * pitchVal, time);
        mPeak.Q.value = 1.4;
        mPeak.gain.value = 3.5;

        var attackPeak = Math.min(0.013, decayVal * 0.25);
        var mgEnv = audioCtx.createGain();
        mgEnv.gain.setValueAtTime(0.0001, time);
        mgEnv.gain.linearRampToValueAtTime(0.18, time + 0.003);
        mgEnv.gain.linearRampToValueAtTime(0.46, time + attackPeak);
        mgEnv.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        mgEnv.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);

        mNoise.connect(mHP);
        mHP.connect(mBP);
        mBP.connect(mPeak);
        mPeak.connect(mgEnv);
        mgEnv.connect(lpf);

        mNoise.start(time + Math.random() * 0.2);
        mNoise.stop(time + decayVal + 0.015);
      } else if (inst.id === 'snare') {
        var b1 = audioCtx.createOscillator();
        var b2 = audioCtx.createOscillator();
        b1.type = 'triangle';
        b2.type = 'sine';
        b1.frequency.setValueAtTime(pitchVal * 1.9, time);
        b1.frequency.exponentialRampToValueAtTime(pitchVal * 0.95, time + 0.025);
        b2.frequency.setValueAtTime(pitchVal * 2.8, time);
        b2.frequency.exponentialRampToValueAtTime(pitchVal * 1.65, time + 0.022);

        var bg1 = audioCtx.createGain();
        var bg2 = audioCtx.createGain();
        var bodyDec = Math.min(0.14, decayVal * 0.45);
        bg1.gain.setValueAtTime(0.34, time);
        bg1.gain.exponentialRampToValueAtTime(0.001, time + bodyDec);
        bg1.gain.linearRampToValueAtTime(0.0, time + bodyDec + 0.008);
        bg2.gain.setValueAtTime(0.24, time);
        bg2.gain.exponentialRampToValueAtTime(0.001, time + bodyDec * 0.85);
        bg2.gain.linearRampToValueAtTime(0.0, time + bodyDec * 0.85 + 0.008);

        b1.connect(bg1);
        b2.connect(bg2);
        bg1.connect(lpf);
        bg2.connect(lpf);
        b1.start(time);
        b2.start(time);
        b1.stop(time + bodyDec + 0.012);
        b2.stop(time + bodyDec + 0.012);

        var sn = audioCtx.createBufferSource();
        sn.buffer = noiseBuffer;
        var shp = audioCtx.createBiquadFilter();
        shp.type = 'highpass';
        shp.frequency.setValueAtTime(1650, time);
        var sPeak = audioCtx.createBiquadFilter();
        sPeak.type = 'peaking';
        sPeak.frequency.setValueAtTime(4200, time);
        sPeak.Q.value = 1.2;
        sPeak.gain.value = 5;

        var sng = audioCtx.createGain();
        sng.gain.setValueAtTime(0.42, time);
        sng.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        sng.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);

        sn.connect(shp);
        shp.connect(sPeak);
        sPeak.connect(snareGritShaper);
        snareGritShaper.connect(sng);
        sng.connect(lpf);
        sn.start(time);
        sn.stop(time + decayVal + 0.015);
      } else if (inst.id === 'bassline') {
        var noteIdx = tracks[instIdx].notes[stepIdx] || 0;
        var semitones = Math.round(pitchVal);
        var freq = midiToHz(BASS_NOTES[noteIdx].midi + semitones);

        var mainSine = audioCtx.createOscillator();
        var octSine = audioCtx.createOscillator();
        mainSine.type = 'sine';
        octSine.type = 'sine';
        mainSine.frequency.setValueAtTime(freq, time);
        octSine.frequency.setValueAtTime(freq * 2, time);

        var octGain = audioCtx.createGain();
        octGain.gain.value = 0.22;

        var bg = audioCtx.createGain();
        bg.gain.setValueAtTime(0.0001, time);
        bg.gain.linearRampToValueAtTime(0.52, time + 0.008);
        bg.gain.exponentialRampToValueAtTime(0.0005, time + decayVal);
        bg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.012);

        mainSine.connect(bg);
        octSine.connect(octGain);
        octGain.connect(bg);
        bg.connect(lpf);

        mainSine.start(time);
        octSine.start(time);
        mainSine.stop(time + decayVal + 0.018);
        octSine.stop(time + decayVal + 0.018);
      }
    }

    function scheduleStep(step, time) {
      var kickHit = false;
      var anyHit = false;
      var maxIdx = finaleActive ? INSTRUMENTS.length - 1 : turnIndex;
      for (var i = 0; i <= maxIdx; i++) {
        var sIdx = step % tracks[i].steps.length;
        if (tracks[i].steps[sIdx]) {
          anyHit = true;
          triggerSound(i, sIdx, time);
          if (INSTRUMENTS[i].id === 'kick') {
            kickHit = true;
          }
        }
      }
      if (anyHit) {
        prevHitAudioTime = lastHitAudioTime;
        lastHitAudioTime = time;
      }
      visualQueue.push({ step: step, time: time, kickHit: kickHit });
    }

    function scheduler() {
      if (!isPlaying || !audioCtx) return;
      if (audioCtx.state !== 'running') {
        nextNoteTime = audioCtx.currentTime + 0.05;
        return;
      }
      var stepDur = 60 / bpm / 4;
      if (nextNoteTime < audioCtx.currentTime - 0.25) {
        nextNoteTime = audioCtx.currentTime + 0.02;
      }
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        scheduleStep(currentStep, nextNoteTime);
        nextNoteTime += stepDur;
        currentStep = (currentStep + 1) % CYCLE_STEPS;
      }
    }

    function startSequencer() {
      try {
        initAndUnlockAudio();
      } catch (e) {}
      if (isPlaying) return;
      if (audioCtx && masterGain) {
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.90, audioCtx.currentTime);
        nextNoteTime = audioCtx.currentTime + 0.05;
      }
      silenceChordSynth();
      setRewind(false);
      setHighPass(false);
      lastHitAudioTime = -1;
      prevHitAudioTime = -1;
      if (ringBuf) ringBuf.fill(0);
      if (audioCtx && hpfReverbWet) {
        hpfReverbWet.gain.setValueAtTime(0.0, audioCtx.currentTime);
      }
      currentStep = 0;
      activePlayStep = 0;
      isPlaying = true;
      schedulerId = setInterval(scheduler, 25);
    }

    function stopSequencer() {
      isPlaying = false;
      clearInterval(schedulerId);
      schedulerId = null;
      visualQueue.length = 0;
      silenceChordSynth();
      setRewind(false);
      setHighPass(false);
      if (audioCtx && hpfReverbWet && hpfReverbSend) {
        hpfReverbSend.gain.setValueAtTime(0.0, audioCtx.currentTime);
        hpfReverbWet.gain.setValueAtTime(0.0, audioCtx.currentTime);
      }
    }

    // ---------------------------------------------------------
    // DOM & TOUCH-FIRST UI
    // ---------------------------------------------------------
    var appEl = document.getElementById('app');
    var startScreen = document.getElementById('startScreen');
    var sequencerScreen = document.getElementById('sequencerScreen');
    var finaleScreen = document.getElementById('finaleScreen');

    var startBtn = document.getElementById('startBtn');
    var clearBtn = document.getElementById('clearBtn');
    var nextBtn = document.getElementById('nextBtn');

    var instName = document.getElementById('instName');
    var bpmSlider = document.getElementById('bpmSlider');

        handler(e);

    function paintStepPad(localIdx, state) {
      var actualStep = getStepOffset() + localIdx;
      tracks[turnIndex].steps[actualStep] = state;
      var pad = stepGrid.querySelector('.step-pad[data-local="' + localIdx + '"]');
      if (pad) pad.classList.toggle('active', state);
    }

    function buildStepGrid() {
      stepGrid.innerHTML = '';
      for (var i = 0; i < 16; i++) {
        (function(localIdx) {
          var wrap = document.createElement('div');
          wrap.className = 'step-wrap';

          var pad = document.createElement('button');
          pad.type = 'button';
          pad.className = 'step-pad mono' + (localIdx % 4 === 0 ? ' beat-mark' : '');
          pad.setAttribute('data-local', localIdx);
          pad.textContent = localIdx + 1;

          var bar = document.createElement('div');
          bar.className = 'playhead-bar';

          pad.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            ensureAudioUnlocked();
            var instId = INSTRUMENTS[turnIndex].id;
            var actualStep = getStepOffset() + localIdx;
            if (isPickerInstrument(instId)) {
              if (!tracks[turnIndex].steps[actualStep]) {
                tracks[turnIndex].steps[actualStep] = true;
                tracks[turnIndex].notes[actualStep] = instId === 'chords' ? lastChosenChordIdx : lastChosenBassNoteIdx;
              }
              renderStepPads();
              openNoteModal(actualStep);
            } else {
              dragPointerId = e.pointerId;
              dragPaint = !tracks[turnIndex].steps[actualStep];
              paintStepPad(localIdx, dragPaint);
            }
          });

          wrap.appendChild(pad);
          wrap.appendChild(bar);
          stepGrid.appendChild(wrap);
        })(i);
      }
    }
    buildStepGrid();

    window.addEventListener('pointermove', function(e) {
      if (dragPointerId === null || e.pointerId !== dragPointerId) return;
      if (isPickerInstrument(INSTRUMENTS[turnIndex].id)) return;
      var hitEl = document.elementFromPoint(e.clientX, e.clientY);
      if (hitEl && hitEl.classList && hitEl.classList.contains('step-pad')) {
        var localIdx = Number(hitEl.getAttribute('data-local'));
        var actualStep = getStepOffset() + localIdx;
        if (!isNaN(localIdx) && tracks[turnIndex].steps[actualStep] !== dragPaint) {
          paintStepPad(localIdx, dragPaint);
        }
      }
    });

    function handlePointerRelease(e) {
      if (e.pointerId === dragPointerId) {
        dragPointerId = null;
      }
      if (e.pointerId === leftPointerId) {
        leftPointerId = null;
        setRewind(false);
      }
      if (e.pointerId === rightPointerId) {
        rightPointerId = null;
        setHighPass(false);
      }
    }

    window.addEventListener('pointerup', handlePointerRelease);
    window.addEventListener('pointercancel', handlePointerRelease);
    window.addEventListener('touchend', function(e) {
      if (e.touches && e.touches.length === 0) {
        dragPointerId = null;
        leftPointerId = null;
        rightPointerId = null;
        setRewind(false);
        setHighPass(false);
      }
    });

    function renderStepPads() {
      var instId = INSTRUMENTS[turnIndex].id;
      var hasPicker = isPickerInstrument(instId);
      var list = instId === 'chords' ? CHORDS : BASS_NOTES;
      var offset = getStepOffset();
      var track = tracks[turnIndex];
      var pads = stepGrid.querySelectorAll('.step-pad');
      for (var i = 0; i < pads.length; i++) {
        var actualStep = offset + i;
        var on = track.steps[actualStep];
        pads[i].classList.toggle('active', on);
        if (hasPicker && on) {
          var nIdx = track.notes[actualStep];
          if (nIdx < 0 || nIdx >= list.length) nIdx = 0;
          pads[i].textContent = list[nIdx].name;
        } else {
          pads[i].textContent = actualStep + 1;
        }
      }
    }

    function openNoteModal(stepIdx) {
      editingStepIdx = stepIdx;
      var instId = INSTRUMENTS[turnIndex].id;
      var isChords = instId === 'chords';
      var list = isChords ? CHORDS : BASS_NOTES;

      var sLabel = (stepIdx + 1) < 10 ? '0' + (stepIdx + 1) : '' + (stepIdx + 1);
      noteModalTitle.textContent = 'STEP ' + sLabel + (isChords ? ' — CHORD' : ' — NOTE');
      noteGrid.classList.toggle('chords-mode', isChords);

      var currentIdx = tracks[turnIndex].notes[stepIdx];
      noteGrid.innerHTML = '';
      for (var i = 0; i < list.length; i++) {
        (function(itemIdx) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'note-btn mono' + (itemIdx === currentIdx ? ' selected' : '');
          btn.textContent = list[itemIdx].name;
          btn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            tracks[turnIndex].steps[editingStepIdx] = true;
            tracks[turnIndex].notes[editingStepIdx] = itemIdx;
            if (isChords) {
              lastChosenChordIdx = itemIdx;
            } else {
              lastChosenBassNoteIdx = itemIdx;
            }
            renderStepPads();
            closeNoteModal();
          });
          noteGrid.appendChild(btn);
        })(i);
      }
      noteModalBackdrop.classList.remove('hidden');
    }

    function closeNoteModal() {
      noteModalBackdrop.classList.add('hidden');
    }

    function removeNoteStep() {
      tracks[turnIndex].steps[editingStepIdx] = false;
      renderStepPads();
      closeNoteModal();
    }

    function updateParamText() {
      var inst = INSTRUMENTS[turnIndex];
      var p = tracks[turnIndex].params;
      if (inst.id === 'bassline') {
        var st = Math.round(lerp(inst.pitchRange[0], inst.pitchRange[1], p.pitch));
        pitchVal.textContent = (st > 0 ? '+' + st : st) + ' st';
      } else if (inst.id === 'chords') {
        var ct = Math.round(lerp(inst.pitchRange[0], inst.pitchRange[1], p.pitch));
        pitchVal.textContent = (ct > 0 ? '+' + ct : ct) + ' ct';
      } else {
        pitchVal.textContent = Math.round(p.pitch * 100) + '%';
      }

      var rawDecay = getRawDecaySec(inst, p.decay);
      if (inst.id === 'chords') {
        var stepCount = (rawDecay / (60 / bpm / 4)).toFixed(1);
        decayVal.textContent = stepCount + ' stp';
      } else {
        decayVal.textContent = Math.round(rawDecay * 1000) + ' ms';
      }

      var hz = Math.round(inst.id === 'bassline' ? normToBassFilterHz(p.filter) : normToFilterHz(p.filter));
      filterVal.textContent = hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : hz + ' Hz';
    }

    function renderTurn() {
      var inst = INSTRUMENTS[turnIndex];
      var track = tracks[turnIndex];
      var isChords = inst.id === 'chords';

      instName.textContent = inst.name;
      chordPage = 0;
      chordPageBar.classList.toggle('hidden', !isChords);
      sequencerScreen.classList.toggle('chords-32', isChords);
      renderChordPageButtons();
      renderStepPads();

      pitchSlider.value = track.params.pitch;
      decaySlider.value = track.params.decay;
      filterSlider.value = track.params.filter;
      updateParamText();

        nextBtn.textContent = INSTRUMENTS[turnIndex + 1].name + ' →';
      } else {
        nextBtn.textContent = 'Play →';

    function drawVinyl(canvas, angle, isPressed) {
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;
      var cx = w / 2;
      var cy = h / 2;
      var outerR = w / 2 - 4;

      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.lineWidth = isPressed ? 2.5 : 1.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      var radii = [outerR - 9, outerR - 17, outerR - 25, outerR - 33, outerR - 41];
      for (var i = 0; i < radii.length; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, radii[i], 0, Math.PI * 2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = isPressed ? '#666666' : '#333333';
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(outerR - 5, 0);
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 17, 0, Math.PI * 2);
      ctx.fillStyle = isPressed ? '#000000' : '#ffffff';
      ctx.fill();
      if (isPressed) {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = isPressed ? '#ffffff' : '#000000';
      ctx.fill();
    }

    function drawPixelPigeon(nowMs) {
      var ctx = pixelCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, 32, 32);

      var frameIdx = 0;
      if (lastKickMs >= 0) {
        var dt = (nowMs - lastKickMs) / 1000;
        var cycleDur = Math.min(0.42, (60 / bpm) * 0.9);
        var t = dt / cycleDur;

        if (t < 0.22) {
          frameIdx = 1;
        } else if (t < 0.56) {
          frameIdx = 2;
        } else if (t < 0.86) {
          frameIdx = 3;
        } else {
          frameIdx = 0;
        }
      }

      var sprite = PIGEON_FRAMES[frameIdx];
      for (var y = 0; y < 32; y++) {
        var rowStr = sprite[y];
        for (var x = 0; x < 32; x++) {
          var ch = rowStr.charAt(x);
          if (ch === '.') continue;
          ctx.fillStyle = ch === '#' ? '#ffffff' : '#666666';
          var drawX = facingDir === 1 ? x : (31 - x);
          ctx.fillRect(drawX, y, 1, 1);
        }
      }
    }

    var lastVisualStep = -1;
    var prevFrameMs = performance.now();

    function loop(nowMs) {
      var frameDt = Math.min(0.05, (nowMs - prevFrameMs) / 1000);
      prevFrameMs = nowMs;

      if (isPlaying && audioCtx) {
        while (visualQueue.length && visualQueue[0].time <= audioCtx.currentTime + 0.015) {
          var ev = visualQueue.shift();
          activePlayStep = ev.step;
          if (finaleActive && ev.kickHit && !rewindActive) {
            lastKickMs = nowMs;
            kickCount++;
            if (kickCount % 4 === 1 && kickCount > 1) {
              facingDir *= -1;
            }
          }
        }

        if (activePlayStep !== lastVisualStep) {
          lastVisualStep = activePlayStep;
          if (!finaleActive) {
            var isChords = INSTRUMENTS[turnIndex].id === 'chords';
            var bars = stepGrid.querySelectorAll('.playhead-bar');
            if (isChords) {
              var playingBar = Math.floor(activePlayStep / 16);
              pageBtn0.classList.toggle('playing', playingBar === 0);
              pageBtn1.classList.toggle('playing', playingBar === 1);
              var pageStart = chordPage * 16;
              for (var i = 0; i < bars.length; i++) {
                bars[i].classList.toggle('now', activePlayStep === pageStart + i);
              }
            } else {
              var localStep = activePlayStep % 16;
              for (var j = 0; j < bars.length; j++) {
                bars[j].classList.toggle('now', j === localStep);
              }
            }
          } else {
            var cells = ma
