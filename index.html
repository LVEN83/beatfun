<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>LET'S GO - BEAT BATTLE</title>

  <!-- Firebase Compat SDKs (App and Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(12px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
      background-color: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: opacity 1s ease;
    }

    .app.vanishing {
      opacity: 0;
    }

    .hidden {
      display: none !important;
    }

    .mono {
      font-family: "Courier New", Courier, monospace;
    }

    button {
      touch-action: manipulation;
      outline: none;
    }

    /* ---------- START SCREEN & WAITING SCREEN ---------- */
    .start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff;
      padding: 24px 16px;
      gap: 28px;
      text-align: center;
    }

    .title-logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;
      margin: 0;
      text-transform: uppercase;
    }

    .sub-logo {
      font-size: 11px;
      letter-spacing: 3px;
      color: #888888;
      margin-top: 6px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 290px;
    }

    .btn-lets-go {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      min-height: 60px;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-lets-go.primary {
      background-color: #ffffff;
      color: #000000;
    }

    .btn-lets-go:active {
      background-color: #333333;
      color: #ffffff;
    }

    .btn-lets-go.primary:active {
      background-color: #cccccc;
      color: #000000;
    }

    .waiting-radar {
      font-size: 13px;
      letter-spacing: 3px;
      animation: blink 1.2s infinite;
      color: #ffffff;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* ---------- BATTLE HEADER (ONLINE MODE) ---------- */
    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid #333333;
      background: #0a0a0a;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .battle-badge {
      font-weight: 800;
      padding: 2px 6px;
      border: 1px solid #ffffff;
    }

    .battle-badge.active-turn {
      background: #ffffff;
      color: #000000;
    }

    .battle-status-msg {
      font-size: 10px;
      color: #aaaaaa;
      text-transform: uppercase;
    }

    /* ---------- SEQUENCER SCREEN ---------- */
    .seq-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ffffff;
      padding: 12px 14px;
      min-height: 0;
      gap: 6px;
      position: relative;
    }

    /* Locked overlay for opponent's turn or playback */
    .locked-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 12px;
    }

    .locked-card {
      border: 1px solid #ffffff;
      background: #000000;
      padding: 18px 24px;
      max-width: 320px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333333;
      padding-bottom: 8px;
    }

    .inst-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .inst-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #444444;
      width: 32px;
      height: 38px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inst-btn:active {
      background: #ffffff;
      color: #000000;
    }

    .inst-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bpm-box {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #333333;
      padding: 0 10px;
      height: 48px;
      font-size: 11px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      touch-action: none;
      margin: 4px 0;
    }

    .step-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .step-pad {
      width: 100%;
      min-height: 48px;
      height: clamp(48px, 7.2dvh, 64px);
      background-color: #000000;
      border: 1px solid #3a3a3a;
      color: #666666;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .step-pad.beat-mark {
      border-left: 3px solid #777777;
    }

    .step-pad.active {
      background-color: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .playhead-bar {
      width: 100%;
      height: 3px;
      background-color: #1a1a1a;
    }

    .playhead-bar.now {
      background-color: #ffffff;
    }

    /* ---------- WAVEFORM SELECTOR & ABLETON PIANO ROLL ---------- */
    .wave-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .wave-btn {
      min-height: 44px;
      background-color: #000000;
      color: #777777;
      border: 1px solid #333333;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .wave-btn.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .piano-roll-wrap {
      flex: 1;
      min-height: 170px;
      border: 1px solid #444444;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .piano-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ---------- PARAMETERS ---------- */
    .params-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .param-box {
      border: 1px solid #333333;
      padding: 4px 12px;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .param-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .param-label {
      color: #999999;
    }

    .param-value {
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      margin: 0;
      background: transparent;
      outline: none;
      touch-action: pan-x;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: #444444;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -10px;
      background: #ffffff;
      border: none;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
      padding-top: 2px;
    }

    .btn-secondary {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #555555;
      min-height: 48px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-secondary:active {
      border-color: #ffffff;
      background-color: #222222;
    }

    .btn-next {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      min-height: 48px;
      padding: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-next:active {
      background-color: #000000;
      color: #ffffff;
    }

    /* ---------- FINALE SCREEN ---------- */
    .finale-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ffffff;
      padding: 14px;
      min-height: 0;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background-color: #222222;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #ffffff;
    }

    .monitor-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pixel-monitor {
      border: 1px solid #ffffff;
      padding: 5px;
      background-color: #000000;
      display: inline-block;
    }

    .pixel-canvas {
      display: block;
      width: clamp(120px, 21dvh, 176px);
      height: clamp(120px, 21dvh, 176px);
      background-color: #000000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .vinyls-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 16px;
    }

    .vinyl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .vinyl-canvas {
      display: block;
      width: clamp(112px, 18dvh, 140px);
      height: clamp(112px, 18dvh, 140px);
      cursor: pointer;
      touch-action: none;
    }

    .vinyl-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666666;
    }

    .vinyl-label.active {
      color: #ffffff;
    }

    .matrix {
      border: 1px solid #333333;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .matrix-row {
      display: grid;
      grid-template-columns: 74px repeat(16, 1fr);
      gap: 2px;
      align-items: center;
    }

    .matrix-name {
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaaaaa;
      white-space: nowrap;
      overflow: hidden;
    }

    .matrix-cell {
      height: 11px;
      border: 1px solid #262626;
      background-color: #000000;
    }

    .matrix-cell.on {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .matrix-cell.now {
      outline: 1.5px solid #ffffff;
    }

    /* Modal dialogs */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      border: 1px solid #ffffff;
      background: #000000;
      padding: 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (hover: hover) {
      .btn-lets-go:hover { background-color: #ffffff; color: #000000; }
      .btn-lets-go.primary:hover { background-color: #dddddd; color: #000000; }
      .step-pad:hover { border-color: #ffffff; }
      .wave-btn:hover { border-color: #ffffff; }
      .btn-secondary:hover { border-color: #ffffff; }
      .btn-next:hover { background-color: #000000; color: #ffffff; }
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <!-- START SCREEN -->
    <div id="startScreen" class="start-screen">
      <div>
        <h1 class="title-logo mono">LET'S GO</h1>
        <div class="sub-logo mono">TOUCH-DRIVEN BEAT BATTLE</div>
      </div>
      <div class="menu-buttons">
        <button type="button" class="btn-lets-go primary" id="btnSoloMode">LOCAL / SOLO</button>
        <button type="button" class="btn-lets-go" id="btnOnlineMode">ONLINE BATTLE (2P)</button>
      </div>
    </div>

    <!-- MATCHMAKING WAITING SCREEN -->
    <div id="waitingScreen" class="start-screen hidden">
      <div>
        <div class="waiting-radar mono" id="waitingStatusText">WAITING FOR OPPONENT...</div>
        <div class="sub-logo mono" style="margin-top: 14px;">FIREBASE REALTIME DB</div>
      </div>
      <div class="menu-buttons">
        <button type="button" class="btn-secondary" id="btnCancelMatchmaking">CANCEL</button>
      </div>
    </div>

    <!-- SEQUENCER SCREEN -->
    <div id="sequencerScreen" class="seq-screen hidden">
      <!-- BATTLE HEADER (ONLINE ONLY) -->
      <div class="battle-header mono hidden" id="battleHeader">
        <div class="battle-badge" id="playerBadge">P1 (YOU)</div>
        <div class="battle-status-msg" id="roundBadge">ROUND 1</div>
        <div class="battle-badge" id="turnIndicator">YOUR TURN</div>
      </div>

      <!-- Turn Locked / Reviewing Overlay -->
      <div class="locked-overlay hidden" id="lockedOverlay">
        <div class="locked-card mono">
          <div class="waiting-radar" id="lockedTitle">OPPONENT'S TURN...</div>
          <div class="sub-logo" id="lockedSub" style="margin-top: 8px;">WAITING FOR NEXT MOVE</div>
        </div>
      </div>

      <div class="top-bar">
        <div class="inst-nav">
          <button type="button" class="inst-btn mono hidden" id="btnPrevInst">&lt;</button>
          <h2 class="inst-name" id="instName">BASS DRUM</h2>
          <button type="button" class="inst-btn mono hidden" id="btnNextInst">&gt;</button>
        </div>

        <div class="bpm-box mono">
          <span>BPM</span>
          <input type="range" id="bpmSlider" min="75" max="155" value="118" style="width: 74px;" />
          <span id="bpmValue">118</span>
        </div>
      </div>

      <!-- Drum 4x4 step pads -->
      <div class="step-grid" id="stepGrid"></div>

      <!-- Synth Waveform Selector -->
      <div class="wave-bar hidden" id="waveBar">
        <button type="button" class="wave-btn mono active" data-wave="sine">SINE</button>
        <button type="button" class="wave-btn mono" data-wave="sawtooth">SAW</button>
        <button type="button" class="wave-btn mono" data-wave="square">SQR</button>
        <button type="button" class="wave-btn mono" data-wave="triangle">TRI</button>
      </div>

      <!-- Ableton-style 1-Octave Piano Roll (Bassline & Synth) -->
      <div class="piano-roll-wrap hidden" id="pianoRollWrap">
        <canvas class="piano-canvas" id="pianoCanvas"></canvas>
      </div>

      <div class="params-grid">
        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label" id="pitchLabel">Pitch</span>
            <span class="param-value" id="pitchVal">50%</span>
          </div>
          <input type="range" id="pitchSlider" min="0" max="1" step="0.01" value="0.5" />
        </div>

        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label">Decay</span>
            <span class="param-value" id="decayVal">300 ms</span>
          </div>
          <input type="range" id="decaySlider" min="0" max="1" step="0.01" value="0.5" />
        </div>

        <div class="param-box">
          <div class="param-top mono">
            <span class="param-label">Lowpass</span>
            <span class="param-value" id="filterVal">8.0 kHz</span>
          </div>
          <input type="range" id="filterSlider" min="0" max="1" step="0.01" value="0.85" />
        </div>
      </div>

      <div class="actions-row">
        <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
        <button type="button" class="btn-next" id="nextBtn">Hi-Hats →</button>
      </div>
    </div>

    <!-- 30-SECOND FINALE SCREEN (SOLO FINALE) -->
    <div id="finaleScreen" class="finale-screen hidden">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="monitor-center">
        <div class="pixel-monitor">
          <canvas class="pixel-canvas" id="pixelCanvas" width="32" height="32"></canvas>
        </div>
      </div>

      <div class="vinyls-row">
        <div class="vinyl-wrap">
          <canvas class="vinyl-canvas" id="leftVinyl" width="144" height="144"></canvas>
          <span class="vinyl-label mono" id="leftVinylLabel">REWIND</span>
        </div>

        <div class="vinyl-wrap">
          <canvas class="vinyl-canvas" id="rightVinyl" width="144" height="144"></canvas>
          <span class="vinyl-label mono" id="rightVinylLabel">HIGHPASS</span>
        </div>
      </div>

      <div class="matrix" id="matrix"></div>
    </div>

    <!-- OPPONENT DISCONNECTED / LEAVE MODAL -->
    <div id="disconnectModal" class="modal-overlay hidden">
      <div class="modal-card mono">
        <div style="font-size: 15px; font-weight: 800; letter-spacing: 2px;">OPPONENT LEFT</div>
        <div style="font-size: 11px; color: #aaaaaa; line-height: 1.5;">The opponent disconnected from the battle.</div>
        <button type="button" class="btn-next" id="btnBackToMenu">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // FIREBASE INITIALIZATION (Compat SDK)
    // ---------------------------------------------------------
    var firebaseConfig = {
      apiKey: "AIzaSyBkr_Q4BSYiMqQP-CehLJkcqR9oWThqZIE",
      authDomain: "beatfun-online.firebaseapp.com",
      databaseURL: "https://beatfun-online-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "beatfun-online",
      storageBucket: "beatfun-online.firebasestorage.app",
      messagingSenderId: "1081244117702",
      appId: "1:1081244117702:web:9dd780428fae15d49445c7"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // Prevent Safari gesture zoom and accidental scrolling
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      e.preventDefault();
    }, { passive: false });

    var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    var IS_SHARP   = [false, true, false, true, false, false, true, false, true, false, true, false];

    function midiToHz(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function midiToLabel(midi) {
      var oct = Math.floor(midi / 12) - 1;
      return NOTE_NAMES[((midi % 12) + 12) % 12] + oct;
    }

    function buildNoteRange(startMidi, endMidi) {
      var list = [];
      for (var m = startMidi; m <= endMidi; m++) {
        list.push({ name: midiToLabel(m), midi: m, sharp: IS_SHARP[((m % 12) + 12) % 12] });
      }
      return list;
    }

    var BASS_NOTES  = buildNoteRange(24, 36); // C1 to C2
    var SYNTH_NOTES = buildNoteRange(60, 72); // C4 to C5

    var INSTRUMENTS = [
      { id: 'kick',     name: 'Bass Drum',  defaults: { pitch: 0.45, decay: 0.55, filter: 0.78 }, pitchRange: [42, 115],    decayRange: [0.12, 0.75] },
      { id: 'hihat',    name: 'Hi-Hats',    defaults: { pitch: 0.55, decay: 0.25, filter: 0.90 }, pitchRange: [0.6, 1.8],   decayRange: [0.03, 0.35] },
      { id: 'tom',      name: 'Toms',       defaults: { pitch: 0.50, decay: 0.45, filter: 0.80 }, pitchRange: [75, 240],    decayRange: [0.10, 0.65] },
      { id: 'shakers',  name: 'Shakers',    defaults: { pitch: 0.50, decay: 0.42, filter: 0.86 }, pitchRange: [0.65, 1.50], decayRange: [0.07, 0.28] },
      { id: 'snare',    name: 'Snare Drum', defaults: { pitch: 0.48, decay: 0.40, filter: 0.85 }, pitchRange: [130, 290],   decayRange: [0.08, 0.50] },
      { id: 'bassline', name: 'Bassline',   defaults: { pitch: 0.50, decay: 0.45, filter: 0.70 }, pitchRange: [-12, 12],    decayRange: [0.06, 0.45] },
      { id: 'synth',    name: 'Synth',      defaults: { pitch: 0,    decay: 0.45, filter: 0.82 }, pitchRange: [-1, 1],      decayRange: [0.008, 0.11] }
    ];

    var STEPS = 16;
    var FINALE_SECONDS = 30;
    var BASE_HPF_HZ = 44;
    var REWIND_SPEED = -0.5;

    var turnIndex = 0;
    var bpm = 118;
    var isPlaying = false;
    var finaleActive = false;
    var tracks = [];

    // Online game state
    var gameMode = 'solo'; // 'solo' or 'online'
    var myRole = null;     // 'player1' or 'player2'
    var currentRoomId = null;
    var roomRef = null;
    var waitingQueueRef = null;
    var currentRound = 1;
    var roomTurn = 'player1';
    var isReviewingMove = false;
    var reviewStepsRemaining = 0;
    var lastHandledMoveTimestamp = 0;

    function resetTracks() {
      tracks = [];
      for (var i = 0; i < INSTRUMENTS.length; i++) {
        var inst = INSTRUMENTS[i];
        var arr = [], noteArr = [], tiedArr = [];
        for (var s = 0; s < STEPS; s++) {
          arr.push(false);
          noteArr.push(0);
          tiedArr.push(false);
        }
        tracks.push({
          steps: arr,
          notes: noteArr,
          tied: tiedArr,
          waveform: 'sine',
          params: {
            pitch: inst.defaults.pitch,
            decay: inst.defaults.decay,
            filter: inst.defaults.filter
          }
        });
      }
    }
    resetTracks();

    // ---------------------------------------------------------
    // WEB AUDIO ENGINE
    // ---------------------------------------------------------
    var audioCtx = null;
    var audioUnlocked = false;
    var mixBus = null;
    var dryMixGain = null;

    var snareGritShaper = null;
    var softClipShaper = null;

    var rewindProcessor = null;
    var rewindLPF = null;
    var rewindOutGain = null;
    var ringBuf = null;
    var ringLen = 0;
    var ringWriteIdx = 0;
    var rewindTopIdx = 0;
    var rewindLoopSpan = 0;
    var rewindCursor = 0;
    var rewindActive = false;

    var rewindStutterBaseIdx = 0;
    var rewindStutterSlice = 0;
    var rewindStutterTotal = 0;
    var rewindElapsedSamples = 0;

    var lastHitAudioTime = -1;
    var prevHitAudioTime = -1;

    var masterHPF = null;
    var masterEQ = null;
    var hpfReverbSend = null;
    var reverbConvolver = null;
    var reverbToneLPF = null;
    var hpfReverbWet = null;
    var masterCompressor = null;
    var masterGain = null;
    var noiseBuffer = null;

    var crowdNodes = null;

    var hpfActive = false;
    var activePlayStep = 0;
    var currentStep = 0;
    var nextNoteTime = 0;
    var schedulerId = null;
    var visualQueue = [];

    function createReverbImpulse(ctx, durationSec, decayPow) {
      var len = Math.floor(ctx.sampleRate * durationSec);
      var impulse = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var ch = 0; ch < 2; ch++) {
        var data = impulse.getChannelData(ch);
        for (var i = 0; i < len; i++) {
          var env = Math.pow(1 - i / len, decayPow);
          data[i] = (Math.random() * 2 - 1) * env;
        }
      }
      return impulse;
    }

    function create909GritCurve() {
      var n = 2048, curve = new Float32Array(n);
      for (var i = 0; i < n; i++) {
        var x = (i * 2) / (n - 1) - 1;
        curve[i] = Math.round(x * 24) / 24;
      }
      return curve;
    }

    function createSoftClipCurve() {
      var n = 4096;
      var curve = new Float32Array(n);
      for (var i = 0; i < n; i++) {
        var x = (i * 2) / (n - 1) - 1;
        curve[i] = (3 * x - Math.pow(x, 3)) / 2;
      }
      return curve;
    }

    function readRingLinear(pos) {
      var idx0 = Math.floor(pos);
      var frac = pos - idx0;
      var i0 = ((idx0 % ringLen) + ringLen) % ringLen;
      var i1 = (i0 + 1) % ringLen;
      return ringBuf[i0] * (1 - frac) + ringBuf[i1] * frac;
    }

    function initAndUnlockAudio() {
      if (navigator.audioSession) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }

      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();

        mixBus = audioCtx.createGain();
        mixBus.gain.value = 0.62;

        dryMixGain = audioCtx.createGain();
        dryMixGain.gain.value = 1.0;

        snareGritShaper = audioCtx.createWaveShaper();
        snareGritShaper.curve = create909GritCurve();
        snareGritShaper.oversample = 'none';

        softClipShaper = audioCtx.createWaveShaper();
        softClipShaper.curve = createSoftClipCurve();
        softClipShaper.oversample = '2x';

        masterHPF = audioCtx.createBiquadFilter();
        masterHPF.type = 'highpass';
        masterHPF.frequency.value = BASE_HPF_HZ;
        masterHPF.Q.value = 0.7;

        masterEQ = audioCtx.createBiquadFilter();
        masterEQ.type = 'peaking';
        masterEQ.frequency.value = 180;
        masterEQ.Q.value = 0.9;
        masterEQ.gain.value = 1.2;

        hpfReverbSend = audioCtx.createGain();
        hpfReverbSend.gain.value = 0.0;

        reverbConvolver = audioCtx.createConvolver();
        reverbConvolver.buffer = createReverbImpulse(audioCtx, 1.4, 3.0);

        reverbToneLPF = audioCtx.createBiquadFilter();
        reverbToneLPF.type = 'lowpass';
        reverbToneLPF.frequency.value = 5200;

        hpfReverbWet = audioCtx.createGain();
        hpfReverbWet.gain.value = 0.0;

        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
        masterCompressor.knee.setValueAtTime(8, audioCtx.currentTime);
        masterCompressor.ratio.setValueAtTime(5, audioCtx.currentTime);
        masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
        masterCompressor.release.setValueAtTime(0.09, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.88;

        mixBus.connect(dryMixGain);
        dryMixGain.connect(masterHPF);

        try {
          ringLen = audioCtx.sampleRate * 6;
          ringBuf = new Float32Array(ringLen);
          ringWriteIdx = 0;

          rewindProcessor = audioCtx.createScriptProcessor(2048, 1, 1);
          rewindProcessor.onaudioprocess = function(e) {
            var inp = e.inputBuffer.getChannelData(0);
            var out = e.outputBuffer.getChannelData(0);
            var len = inp.length;

            if (!rewindActive) {
              for (var i = 0; i < len; i++) {
                ringBuf[ringWriteIdx] = inp[i];
                ringWriteIdx = (ringWriteIdx + 1) % ringLen;
                out[i] = 0;
              }
              return;
            }

            var fadeN = 256;
            for (var j = 0; j < len; j++) {
              if (rewindElapsedSamples < rewindStutterTotal) {
                var posInSlice = rewindElapsedSamples % rewindStutterSlice;
                var env = 1.0;
                if (posInSlice < 96) {
                  env = posInSlice / 96;
                } else if (posInSlice > rewindStutterSlice * 0.70) {
                  env = Math.max(0, 1 - (posInSlice - rewindStutterSlice * 0.70) / (rewindStutterSlice * 0.30));
                }
                out[j] = readRingLinear(rewindStutterBaseIdx + posInSlice) * env;
                rewindElapsedSamples++;
              } else {
                var s = readRingLinear(rewindTopIdx - rewindLoopSpan + rewindCursor);
                if (rewindCursor < fadeN) {
                  var mix = rewindCursor / fadeN;
                  var wrapS = readRingLinear(rewindTopIdx + rewindCursor);
                  s = wrapS * (1 - mix) + s * mix;
                }
                out[j] = s;

                rewindCursor += REWIND_SPEED;
                if (rewindCursor < 0) {
                  rewindCursor += rewindLoopSpan;
                }
              }
            }
          };

          rewindLPF = audioCtx.createBiquadFilter();
          rewindLPF.type = 'lowpass';
          rewindLPF.frequency.value = 950;
          rewindLPF.Q.value = 1.0;

          rewindOutGain = audioCtx.createGain();
          rewindOutGain.gain.value = 0.0;

          mixBus.connect(rewindProcessor);
          rewindProcessor.connect(rewindLPF);
          rewindLPF.connect(rewindOutGain);
          rewindOutGain.connect(masterHPF);
        } catch (err) {
          rewindProcessor = null;
        }

        masterHPF.connect(masterEQ);
        masterEQ.connect(softClipShaper);

        masterHPF.connect(hpfReverbSend);
        hpfReverbSend.connect(reverbConvolver);
        reverbConvolver.connect(reverbToneLPF);
        reverbToneLPF.connect(hpfReverbWet);
        hpfReverbWet.connect(softClipShaper);

        softClipShaper.connect(masterCompressor);
        masterCompressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        var len = audioCtx.sampleRate * 2;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        var ch = noiseBuffer.getChannelData(0);
        for (var i = 0; i < len; i++) {
          ch[i] = Math.random() * 2 - 1;
        }
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(function() {
          if (isPlaying && audioCtx) {
            nextNoteTime = audioCtx.currentTime + 0.03;
          }
        }).catch(function() {});
      }

      if (!audioUnlocked) {
        try {
          var silentBuf = audioCtx.createBuffer(1, 1, 22050);
          var silentSrc = audioCtx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(audioCtx.destination);
          silentSrc.start(0);
          if (audioCtx.state === 'running') {
            audioUnlocked = true;
          }
        } catch (e) {}
      }
    }

    function ensureAudioUnlocked() {
      if (audioCtx && audioCtx.state !== 'running') {
        initAndUnlockAudio();
      }
    }
    document.addEventListener('touchend', ensureAudioUnlocked, true);
    document.addEventListener('click', ensureAudioUnlocked, true);
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    function setRewind(on) {
      if (rewindActive === on) return;
      rewindActive = on;
      leftVinylLabel.classList.toggle('active', on);
      if (!audioCtx || !dryMixGain || !rewindOutGain || !rewindProcessor) return;

      var now = audioCtx.currentTime;
      if (on) {
        var sr = audioCtx.sampleRate;
        var barSamples = Math.round((240 / bpm) * sr);
        rewindLoopSpan = Math.min(ringLen - 1024, Math.max(2048, barSamples));
        rewindTopIdx = (ringWriteIdx - 256 + ringLen) % ringLen;

        var refHit = lastHitAudioTime;
        if (refHit > now - 0.055 && prevHitAudioTime > 0) {
          refHit = prevHitAudioTime;
        }
        var hitAgeSamples = Math.round(0.14 * sr);
        if (refHit > 0 && (now - refHit) < (rewindLoopSpan / sr)) {
          hitAgeSamples = Math.max(Math.round(0.05 * sr), Math.min(rewindLoopSpan - 512, Math.round((now - refHit) * sr)));
        }

        rewindStutterSlice = Math.round(0.038 * sr);
        rewindStutterTotal = rewindStutterSlice * 3;
        rewindElapsedSamples = 0;
        rewindStutterBaseIdx = (rewindTopIdx - hitAgeSamples + ringLen) % ringLen;

        var tailOffset = Math.round(0.11 * sr);
        var backSamples = Math.max(0, Math.min(rewindLoopSpan - 512, hitAgeSamples - tailOffset));
        rewindCursor = Math.max(256, rewindLoopSpan - backSamples);

        dryMixGain.gain.setTargetAtTime(0.0, now, 0.005);
        rewindOutGain.gain.setTargetAtTime(1.15, now, 0.005);
      } else {
        rewindOutGain.gain.setTargetAtTime(0.0, now, 0.008);
        dryMixGain.gain.setTargetAtTime(1.0, now, 0.008);
      }
    }

    function triggerHpfNoiseBurst() {
      if (!audioCtx || !noiseBuffer || !masterHPF) return;
      var now = audioCtx.currentTime;

      var src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;

      var bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(900, now);
      bp.frequency.exponentialRampToValueAtTime(3200, now + 0.28);
      bp.Q.value = 1.1;

      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.linearRampToValueAtTime(0.11, now + 0.02);
      g.exponentialRampToValueAtTime(0.0001, now + 0.34);

      src.connect(bp);
      bp.connect(g);
      g.connect(masterHPF);

      src.start(now);
      src.stop(now + 0.36);
    }

    function startCrowdSwell() {
      stopCrowdSwell();
      if (!audioCtx || !noiseBuffer || !masterCompressor) return;

      var now = audioCtx.currentTime;
      var skipBeatSec = 60 / bpm;
      var swellStart = now + skipBeatSec;

      var src1 = audioCtx.createBufferSource();
      var src2 = audioCtx.createBufferSource();
      src1.buffer = noiseBuffer;
      src2.buffer = noiseBuffer;
      src1.loop = true;
      src2.loop = true;

      var fLow = audioCtx.createBiquadFilter();
      fLow.type = 'bandpass'; fLow.frequency.value = 390; fLow.Q.value = 2.4;

      var fMid = audioCtx.createBiquadFilter();
      fMid.type = 'bandpass'; fMid.frequency.value = 820; fMid.Q.value = 2.6;

      var fHigh = audioCtx.createBiquadFilter();
      fHigh.type = 'bandpass'; fHigh.frequency.value = 1480; fHigh.Q.value = 2.8;

      var fAir = audioCtx.createBiquadFilter();
      fAir.type = 'bandpass'; fAir.frequency.value = 2700; fAir.Q.value = 1.8;

      var lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 5.2;
      var lfoDepth = audioCtx.createGain();
      lfoDepth.gain.value = 75;
      lfo.connect(lfoDepth);
      lfoDepth.connect(fMid.frequency);
      lfoDepth.connect(fHigh.frequency);

      var sumGain = audioCtx.createGain();
      sumGain.gain.value = 1.0;

      var toneLPF = audioCtx.createBiquadFilter();
      toneLPF.type = 'lowpass';
      toneLPF.frequency.setValueAtTime(700, now);
      toneLPF.frequency.setValueAtTime(700, swellStart);
      toneLPF.frequency.exponentialRampToValueAtTime(4200, swellStart + 5.5);

      var crowdGain = audioCtx.createGain();
      crowdGain.gain.setValueAtTime(0.0001, now);
      crowdGain.gain.setValueAtTime(0.0001, swellStart);
      crowdGain.gain.exponentialRampToValueAtTime(0.35, swellStart + 4.8);

      src1.connect(fLow);
      src2.connect(fMid);
      src1.connect(fHigh);
      src2.connect(fAir);

      fLow.connect(sumGain);
      fMid.connect(sumGain);
      fHigh.connect(sumGain);
      fAir.connect(sumGain);

      sumGain.connect(toneLPF);
      toneLPF.connect(crowdGain);

      crowdGain.connect(masterCompressor);
      if (reverbConvolver) {
        var revSend = audioCtx.createGain();
        revSend.gain.value = 0.40;
        crowdGain.connect(revSend);
        revSend.connect(reverbConvolver);
      }

      src1.start(now, 0.1);
      src2.start(now, 0.9);
      lfo.start(now);

      crowdNodes = { src1: src1, src2: src2, lfo: lfo, gain: crowdGain };
    }

    function stopCrowdSwell() {
      if (!crowdNodes || !audioCtx) return;
      var nodes = crowdNodes;
      crowdNodes = null;
      var now = audioCtx.currentTime;
      try {
        nodes.gain.gain.cancelScheduledValues(now);
        nodes.gain.gain.setValueAtTime(Math.max(0.0001, nodes.gain.gain.value), now);
        nodes.gain.gain.linearRampToValueAtTime(0.0, now + 0.035);
        nodes.src1.stop(now + 0.045);
        nodes.src2.stop(now + 0.045);
        nodes.lfo.stop(now + 0.045);
      } catch (e) {}
    }

    function setHighPass(on) {
      if (hpfActive === on) return;
      hpfActive = on;
      rightVinylLabel.classList.toggle('active', on);
      if (!audioCtx || !masterHPF) return;

      var now = audioCtx.currentTime;
      masterHPF.frequency.cancelScheduledValues(now);
      masterHPF.frequency.setValueAtTime(Math.max(BASE_HPF_HZ, masterHPF.frequency.value), now);

      if (on) {
        masterHPF.frequency.exponentialRampToValueAtTime(700, now + 0.28);
        masterHPF.Q.setTargetAtTime(1.6, now, 0.04);
        hpfReverbWet.gain.setTargetAtTime(0.32, now, 0.03);
        hpfReverbSend.gain.setTargetAtTime(0.40, now, 0.05);
        triggerHpfNoiseBurst();
        startCrowdSwell();
      } else {
        masterHPF.frequency.exponentialRampToValueAtTime(BASE_HPF_HZ, now + 0.09);
        masterHPF.Q.setTargetAtTime(0.7, now, 0.04);
        hpfReverbSend.gain.setTargetAtTime(0.0, now, 0.02);
        stopCrowdSwell();
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function normToFilterHz(t) {
      return 120 * Math.pow(18000 / 120, t);
    }

    function normToBassFilterHz(t) {
      return 45 * Math.pow(900 / 45, t);
    }

    function getStitchedSpan(track, startStep) {
      var span = 1;
      var baseNote = track.notes[startStep];
      while (
        startStep + span < STEPS &&
        track.steps[startStep + span] &&
        track.tied[startStep + span] &&
        track.notes[startStep + span] === baseNote
      ) {
        span++;
      }
      return span;
    }

    function triggerSound(instIdx, stepIdx, time) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      var inst = INSTRUMENTS[instIdx];
      var track = tracks[instIdx];
      var p = track.params;
      var pitchVal = inst.id === 'synth' ? Math.round(p.pitch) : lerp(inst.pitchRange[0], inst.pitchRange[1], p.pitch);
      var decayVal = lerp(inst.decayRange[0], inst.decayRange[1], p.decay);
      var cutoff = inst.id === 'bassline' ? normToBassFilterHz(p.filter) : normToFilterHz(p.filter);

      if (inst.id === 'bassline' && track.tied[stepIdx]) {
        return;
      }

      var lpf = audioCtx.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.setValueAtTime(cutoff, time);
      lpf.Q.value = 0.7;
      lpf.connect(mixBus);

      if (inst.id === 'kick') {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitchVal * 2.8, time);
        osc.frequency.exponentialRampToValueAtTime(pitchVal, time + Math.min(0.055, decayVal * 0.6));
        g.gain.setValueAtTime(0.0001, time);
        g.gain.linearRampToValueAtTime(0.66, time + 0.003);
        g.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        g.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);
        osc.connect(g);
        g.connect(lpf);
        osc.start(time);
        osc.stop(time + decayVal + 0.015);

        var clickOsc = audioCtx.createOscillator();
        var clickGain = audioCtx.createGain();
        clickOsc.type = 'triangle';
        clickOsc.frequency.setValueAtTime(1400, time);
        clickOsc.frequency.exponentialRampToValueAtTime(180, time + 0.006);
        clickGain.gain.setValueAtTime(0.18, time);
        clickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.008);
        clickGain.gain.linearRampToValueAtTime(0.0, time + 0.01);
        clickOsc.connect(clickGain);
        clickGain.connect(lpf);
        clickOsc.start(time);
        clickOsc.stop(time + 0.012);
      } else if (inst.id === 'hihat') {
        var hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(4500 * pitchVal, time);

        var hatTame = audioCtx.createBiquadFilter();
        hatTame.type = 'highshelf';
        hatTame.frequency.value = 11000;
        hatTame.gain.value = -3.5;

        hp.connect(hatTame);
        hatTame.connect(lpf);

        var noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        var ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.28, time);
        ng.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        ng.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);
        noise.connect(ng);
        ng.connect(hp);
        noise.start(time);
        noise.stop(time + decayVal + 0.012);

        var ratios = [2, 3.1, 4.2, 5.4, 6.8];
        var mg = audioCtx.createGain();
        mg.gain.setValueAtTime(0.11, time);
        mg.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        mg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);
        mg.connect(hp);
        for (var i = 0; i < ratios.length; i++) {
          var ho = audioCtx.createOscillator();
          ho.type = 'square';
          ho.frequency.setValueAtTime(260 * pitchVal * ratios[i], time);
          ho.connect(mg);
          ho.start(time);
          ho.stop(time + decayVal + 0.012);
        }
      } else if (inst.id === 'tom') {
        var tosc = audioCtx.createOscillator();
        var tg = audioCtx.createGain();
        tosc.type = 'sine';
        tosc.frequency.setValueAtTime(pitchVal * 1.75, time);
        tosc.frequency.exponentialRampToValueAtTime(pitchVal, time + Math.min(0.08, decayVal * 0.6));
        tg.gain.setValueAtTime(0.0001, time);
        tg.gain.linearRampToValueAtTime(0.50, time + 0.003);
        tg.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        tg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);
        tosc.connect(tg);
        tg.connect(lpf);
        tosc.start(time);
        tosc.stop(time + decayVal + 0.015);
      } else if (inst.id === 'shakers') {
        var sNoise = audioCtx.createBufferSource();
        sNoise.buffer = noiseBuffer;

        var sHP = audioCtx.createBiquadFilter();
        sHP.type = 'highpass';
        sHP.frequency.setValueAtTime(2400 * pitchVal, time);

        var sBP = audioCtx.createBiquadFilter();
        sBP.type = 'bandpass';
        sBP.frequency.setValueAtTime(5200 * pitchVal, time);
        sBP.Q.value = 1.1;

        var sTame = audioCtx.createBiquadFilter();
        sTame.type = 'highshelf';
        sTame.frequency.value = 9500;
        sTame.gain.value = -3.0;

        var swellTime = Math.min(0.024, decayVal * 0.28);
        var sEnv = audioCtx.createGain();
        sEnv.gain.setValueAtTime(0.0001, time);
        sEnv.gain.linearRampToValueAtTime(0.09, time + swellTime * 0.45);
        sEnv.gain.linearRampToValueAtTime(0.38, time + swellTime);
        sEnv.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        sEnv.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);

        sNoise.connect(sHP);
        sHP.connect(sBP);
        sBP.connect(sTame);
        sTame.connect(sEnv);
        sEnv.connect(lpf);

        sNoise.start(time, Math.random() * 0.8);
        sNoise.stop(time + decayVal + 0.015);
      } else if (inst.id === 'snare') {
        var b1 = audioCtx.createOscillator();
        var b2 = audioCtx.createOscillator();
        b1.type = 'triangle';
        b2.type = 'sine';
        b1.frequency.setValueAtTime(pitchVal * 1.9, time);
        b1.frequency.exponentialRampToValueAtTime(pitchVal * 0.95, time + 0.025);
        b2.frequency.setValueAtTime(pitchVal * 2.8, time);
        b2.frequency.exponentialRampToValueAtTime(pitchVal * 1.65, time + 0.022);

        var bg1 = audioCtx.createGain();
        var bg2 = audioCtx.createGain();
        var bodyDec = Math.min(0.14, decayVal * 0.45);
        bg1.gain.setValueAtTime(0.32, time);
        bg1.gain.exponentialRampToValueAtTime(0.001, time + bodyDec);
        bg1.gain.linearRampToValueAtTime(0.0, time + bodyDec + 0.008);
        bg2.gain.setValueAtTime(0.22, time);
        bg2.gain.exponentialRampToValueAtTime(0.001, time + bodyDec * 0.85);
        bg2.gain.linearRampToValueAtTime(0.0, time + bodyDec * 0.85 + 0.008);

        b1.connect(bg1);
        b2.connect(bg2);
        bg1.connect(lpf);
        bg2.connect(lpf);
        b1.start(time);
        b2.start(time);
        b1.stop(time + bodyDec + 0.012);
        b2.stop(time + bodyDec + 0.012);

        var sn = audioCtx.createBufferSource();
        sn.buffer = noiseBuffer;
        var shp = audioCtx.createBiquadFilter();
        shp.type = 'highpass';
        shp.frequency.setValueAtTime(1650, time);
        var sPeak = audioCtx.createBiquadFilter();
        sPeak.type = 'peaking';
        sPeak.frequency.setValueAtTime(4200, time);
        sPeak.Q.value = 1.2;
        sPeak.gain.value = 5;

        var sng = audioCtx.createGain();
        sng.gain.setValueAtTime(0.38, time);
        sng.gain.exponentialRampToValueAtTime(0.001, time + decayVal);
        sng.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.01);

        sn.connect(shp);
        shp.connect(sPeak);
        sPeak.connect(snareGritShaper);
        snareGritShaper.connect(sng);
        sng.connect(lpf);
        sn.start(time);
        sn.stop(time + decayVal + 0.015);
      } else if (inst.id === 'bassline') {
        var stepDur = 60 / bpm / 4;
        var span = getStitchedSpan(track, stepIdx);
        var noteIdx = track.notes[stepIdx] || 0;
        var semitones = Math.round(pitchVal);
        var freq = midiToHz(BASS_NOTES[noteIdx].midi + semitones);

        var mainSine = audioCtx.createOscillator();
        mainSine.type = 'sine';
        mainSine.frequency.setValueAtTime(freq, time);

        var octSine = audioCtx.createOscillator();
        octSine.type = 'sine';
        octSine.frequency.setValueAtTime(freq * 2, time);

        var midSine = audioCtx.createOscillator();
        midSine.type = 'triangle';
        midSine.frequency.setValueAtTime(freq * 3, time);

        var octGain = audioCtx.createGain();
        octGain.gain.value = 0.26;

        var midGain = audioCtx.createGain();
        midGain.gain.value = 0.08;

        var bg = audioCtx.createGain();
        bg.gain.setValueAtTime(0.0001, time);

        var endTime;
        if (span > 1) {
          var holdDur = Math.max(0.04, span * stepDur - 0.015);
          var rel = Math.min(0.045, holdDur * 0.25);
          bg.gain.linearRampToValueAtTime(0.28, time + 0.012);
          bg.gain.setValueAtTime(0.28, time + Math.max(0.014, holdDur - rel));
          bg.gain.exponentialRampToValueAtTime(0.0005, time + holdDur);
          bg.gain.linearRampToValueAtTime(0.0, time + holdDur + 0.005);
          endTime = time + holdDur + 0.008;
        } else {
          bg.gain.linearRampToValueAtTime(0.36, time + 0.008);
          bg.gain.exponentialRampToValueAtTime(0.0005, time + decayVal);
          bg.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.008);
          endTime = time + decayVal + 0.012;
        }

        mainSine.connect(bg);
        octSine.connect(octGain);
        octGain.connect(bg);
        midSine.connect(midGain);
        midGain.connect(bg);
        bg.connect(lpf);

        mainSine.start(time);
        octSine.start(time);
        midSine.start(time);
        mainSine.stop(endTime);
        octSine.stop(endTime);
        midSine.stop(endTime);
      } else if (inst.id === 'synth') {
        var sNoteIdx = track.notes[stepIdx];
        if (sNoteIdx === undefined || sNoteIdx < 0 || sNoteIdx >= SYNTH_NOTES.length) sNoteIdx = 0;
        var octShift = Math.round(pitchVal) * 12;
        var sFreq = midiToHz(SYNTH_NOTES[sNoteIdx].midi + octShift);
        var wave = track.waveform || 'sine';

        var sOsc = audioCtx.createOscillator();
        sOsc.type = wave;
        sOsc.frequency.setValueAtTime(sFreq, time);

        var peakAmp = (wave === 'sawtooth' || wave === 'square') ? 0.32 : 0.44;
        var sG = audioCtx.createGain();
        sG.gain.setValueAtTime(0.0001, time);
        sG.gain.linearRampToValueAtTime(peakAmp, time + 0.0015);
        sG.gain.exponentialRampToValueAtTime(0.0005, time + decayVal);
        sG.gain.linearRampToValueAtTime(0.0, time + decayVal + 0.004);

        sOsc.connect(sG);
        sG.connect(lpf);
        sOsc.start(time);
        sOsc.stop(time + decayVal + 0.008);
      }
    }

    function scheduleStep(step, time) {
      var kickHit = false;
      var anyHit = false;
      var maxIdx = (finaleActive || gameMode === 'online') ? INSTRUMENTS.length - 1 : turnIndex;
      for (var i = 0; i <= maxIdx; i++) {
        if (tracks[i].steps[step]) {
          if (!tracks[i].tied[step]) {
            anyHit = true;
          }
          triggerSound(i, step, time);
          if (INSTRUMENTS[i].id === 'kick') {
            kickHit = true;
          }
        }
      }
      if (anyHit) {
        prevHitAudioTime = lastHitAudioTime;
        lastHitAudioTime = time;
      }
      visualQueue.push({ step: step, time: time, kickHit: kickHit });

      // Handle automatic opponent move playback duration
      if (isReviewingMove) {
        reviewStepsRemaining--;
        if (reviewStepsRemaining <= 0) {
          isReviewingMove = false;
          updateTurnStatusUI();
        }
      }
    }

    function scheduler() {
      if (!isPlaying || !audioCtx) return;
      if (audioCtx.state !== 'running') {
        nextNoteTime = audioCtx.currentTime + 0.05;
        return;
      }
      var stepDur = 60 / bpm / 4;
      if (nextNoteTime < audioCtx.currentTime - 0.25) {
        nextNoteTime = audioCtx.currentTime + 0.02;
      }
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        scheduleStep(currentStep, nextNoteTime);
        nextNoteTime += stepDur;
        currentStep = (currentStep + 1) % STEPS;
      }
    }

    function startSequencer() {
      try {
        initAndUnlockAudio();
      } catch (e) {}
      if (isPlaying) return;
      if (audioCtx && masterGain) {
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.88, audioCtx.currentTime);
        nextNoteTime = audioCtx.currentTime + 0.05;
      }
      setRewind(false);
      setHighPass(false);
      lastHitAudioTime = -1;
      prevHitAudioTime = -1;
      if (ringBuf) ringBuf.fill(0);
      if (audioCtx && hpfReverbWet) {
        hpfReverbWet.gain.setValueAtTime(0.0, audioCtx.currentTime);
      }
      currentStep = 0;
      activePlayStep = 0;
      isPlaying = true;
      schedulerId = setInterval(scheduler, 25);
    }

    function stopSequencer() {
      isPlaying = false;
      clearInterval(schedulerId);
      schedulerId = null;
      visualQueue.length = 0;
      setRewind(false);
      setHighPass(false);
      if (audioCtx && hpfReverbWet && hpfReverbSend) {
        hpfReverbSend.gain.setValueAtTime(0.0, audioCtx.currentTime);
        hpfReverbWet.gain.setValueAtTime(0.0, audioCtx.currentTime);
      }
    }

    function serializeMove() {
      var compactTracks = [];
      for (var i = 0; i < tracks.length; i++) {
        compactTracks.push({
          steps: tracks[i].steps.slice(),
          notes: tracks[i].notes.slice(),
          tied: tracks[i].tied.slice(),
          waveform: tracks[i].waveform,
          params: {
            pitch: tracks[i].params.pitch,
            decay: tracks[i].params.decay,
            filter: tracks[i].params.filter
          }
        });
      }
      return {
        bpm: bpm,
        tracks: compactTracks,
        sender: myRole,
        timestamp: Date.now()
      };
    }

    function applyOpponentMove(moveData) {
      if (!moveData || !moveData.tracks) return;
      bpm = moveData.bpm || 118;
      bpmSlider.value = bpm;
      bpmValue.textContent = bpm;

      for (var i = 0; i < moveData.tracks.length && i < tracks.length; i++) {
        var mt = moveData.tracks[i];
        tracks[i].steps = mt.steps.slice();
        tracks[i].notes = mt.notes.slice();
        tracks[i].tied = mt.tied.slice();
        tracks[i].waveform = mt.waveform || 'sine';
        tracks[i].params = {
          pitch: mt.params.pitch,
          decay: mt.params.decay,
          filter: mt.params.filter
        };
      }
      renderTurn();
    }

    function startOnlineMatchmaking() {
      initAndUnlockAudio();
      gameMode = 'online';
      myRole = null;
      currentRoomId = null;

      startScreen.classList.add('hidden');
      waitingScreen.classList.remove('hidden');
      document.getElementById('waitingStatusText').textContent = 'SEARCHING FOR OPPONENT...';

      var waitingQueue = db.ref('queue/waiting');
      waitingQueueRef = waitingQueue;

      var targetRoomId = null;
      var roleToAssign = null;

      waitingQueue.transaction(function(curr) {
        if (curr && curr.roomId) {
          targetRoomId = curr.roomId;
          roleToAssign = 'player2';
          return null; // Claim and clear the waiting queue
        } else {
          var newRoomKey = db.ref('rooms').push().key;
          targetRoomId = newRoomKey;
          roleToAssign = 'player1';
          return { roomId: newRoomKey, createdAt: firebase.database.ServerValue.TIMESTAMP };
        }
      }, function(err, committed, snapshot) {
        if (err || !committed) {
          document.getElementById('waitingStatusText').textContent = 'CONNECTION ERROR';
          return;
        }

        myRole = roleToAssign;
        currentRoomId = targetRoomId;
        roomRef = db.ref('rooms/' + currentRoomId);

        if (myRole === 'player1') {
          // Waiting for player 2
          waitingQueue.onDisconnect().remove();

          roomRef.set({
            turn: 'player1',
            round: 1,
            scores: { player1: 0, player2: 0 },
            lastMove: null,
            players: {
              player1: { connected: true },
              player2: { connected: false }
            }
          });

          roomRef.child('players/player1/connected').onDisconnect().set(false);

          // Watch for player 2 joining
          roomRef.child('players/player2/connected').on('value', function(snap) {
            if (snap.val() === true) {
              waitingQueue.onDisconnect().cancel();
              launchOnlineBattle();
            }
          });
        } else {
          // Player 2 joined existing room
          roomRef.child('players/player2/connected').onDisconnect().set(false);
          roomRef.child('players/player2').update({ connected: true });
          launchOnlineBattle();
        }
      });
    }

    function launchOnlineBattle() {
      waitingScreen.classList.add('hidden');
      sequencerScreen.classList.remove('hidden');
      battleHeader.classList.remove('hidden');
      btnPrevInst.classList.remove('hidden');
      btnNextInst.classList.remove('hidden');

      turnIndex = 0;
      resetTracks();
      renderTurn();
      startSequencer();

      // Setup room synchronizer
      roomRef.on('value', function(snap) {
        var data = snap.val();
        if (!data) return;

        // Check opponent connection
        var opp = myRole === 'player1' ? 'player2' : 'player1';
        if (data.players && data.players[opp] && data.players[opp].connected === false) {
          handleOpponentDisconnected();
          return;
        }

        currentRound = data.round || 1;
        roomTurn = data.turn || 'player1';

        // Detect new move sent by opponent
        if (data.lastMove && data.lastMove.sender !== myRole && data.lastMove.timestamp !== lastHandledMoveTimestamp) {
          lastHandledMoveTimestamp = data.lastMove.timestamp;
          applyOpponentMove(data.lastMove);

          // If it is now our turn, play opponent's move for 2 bars (32 steps) before unlocking
          if (roomTurn === myRole) {
            isReviewingMove = true;
            reviewStepsRemaining = 32;
          }
        }

        updateTurnStatusUI();
      });
    }

    function sendOnlineMove() {
      if (!isMyTurn()) return;
      var move = serializeMove();
      var nextTurn = myRole === 'player1' ? 'player2' : 'player1';
      var nextRound = myRole === 'player2' ? currentRound + 1 : currentRound;

      roomRef.update({
        lastMove: move,
        turn: nextTurn,
        round: nextRound
      });
    }

    function handleOpponentDisconnected() {
      stopSequencer();
      disconnectModal.classList.remove('hidden');
    }

    function cancelMatchmaking() {
      if (waitingQueueRef && myRole === 'player1') {
        waitingQueueRef.remove();

      if (roomRef) {
        roomRef.off();
        if (myRole === 'player1') roomRef.remove();
      }
      waitingScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    }

    // ---------------------------------------------------------
    // ABLETON-STYLE 1-OCTAVE PIANO ROLL
    // ---------------------------------------------------------
    var PIANO_KEY_W = 28;

    function getPianoNoteList() {
      return INSTRUMENTS[turnIndex].id === 'bassline' ? BASS_NOTES : SYNTH_NOTES;
    }

    function getPianoCellAt(clientX, clientY) {
      var rect = pianoCanvas.getBoundingClientRect();
      var x = clientX - rect.left;
      var y = clientY - rect.top;
      var gridW = rect.width - PIANO_KEY_W;
      var step = Math.floor(((x - PIANO_KEY_W) / gridW) * STEPS);
      if (step < 0) step = 0;
      if (step >= STEPS) step = STEPS - 1;

      var noteList = getPianoNoteList();
      var numRows = noteList.length;
      var rowFromTop = Math.floor((y / rect.height) * numRows);
      if (rowFromTop < 0) rowFromTop = 0;
      if (rowFromTop >= numRows) rowFromTop = numRows - 1;
      var noteIdx = (numRows - 1) - rowFromTop;
      return { step: step, noteIdx: noteIdx };
    }

    function untieIfNeeded(track, step) {
      if (step + 1 < STEPS && (!track.steps[step] || track.notes[step + 1] !== track.notes[step])) {
        track.tied[step + 1] = false;
      }
    }

    pianoCanvas.addEventListener('pointerdown', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;
      e.preventDefault();
      ensureAudioUnlocked();
      pianoPointerId = e.pointerId;
      pianoMovedHoriz = false;
      var cell = getPianoCellAt(e.clientX, e.clientY);
      var track = tracks[turnIndex];

      if (track.steps[cell.step] && track.notes[cell.step] === cell.noteIdx) {
        pianoDrawMode = 'erase';
        track.steps[cell.step] = false;
        track.tied[cell.step] = false;
        untieIfNeeded(track, cell.step);
      } else {
        pianoDrawMode = 'draw';
        track.steps[cell.step] = true;
        track.notes[cell.step] = cell.noteIdx;
        track.tied[cell.step] = false;
        untieIfNeeded(track, cell.step);
      }
      pianoLastStep = cell.step;
      pianoAnchorNote = cell.noteIdx;
      drawPianoRoll();
    });

    function drawPianoRoll() {
      var rect = pianoCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var dpr = window.devicePixelRatio || 1;
      var targetW = Math.round(rect.width * dpr);
      var targetH = Math.round(rect.height * dpr);
      if (pianoCanvas.width !== targetW || pianoCanvas.height !== targetH) {
        pianoCanvas.width = targetW;
        pianoCanvas.height = targetH;
      }

      var ctx = pianoCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var w = rect.width;
      var h = rect.height;
      var inst = INSTRUMENTS[turnIndex];
      var noteList = getPianoNoteList();
      var numRows = noteList.length;
      var rowH = h / numRows;
      var gridW = w - PIANO_KEY_W;
      var colW = gridW / STEPS;

      ctx.clearRect(0, 0, w, h);

      var track = tracks[turnIndex];
      var pitchShiftSemis = inst.id === 'synth'
        ? Math.round(track.params.pitch) * 12
        : Math.round(lerp(inst.pitchRange[0], inst.pitchRange[1], track.params.pitch));

      for (var r = 0; r < numRows; r++) {
        var noteIdx = (numRows - 1) - r;
        var noteObj = noteList[noteIdx];
        var y = r * rowH;

        ctx.fillStyle = noteObj.sharp ? '#0f0f0f' : '#000000';
        ctx.fillRect(PIANO_KEY_W, y, gridW, rowH);

        ctx.fillStyle = noteObj.sharp ? '#1c1c1c' : '#d8d8d8';
        ctx.fillRect(0, y, PIANO_KEY_W - 1, rowH - 0.5);

        if (!noteObj.sharp) {
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 8px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(midiToLabel(noteObj.midi + pitchShiftSemis), (PIANO_KEY_W - 1) / 2, y + rowH / 2 + 0.5);
        }

        ctx.strokeStyle = '#222222';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(PIANO_KEY_W, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      for (var s = 0; s <= STEPS; s++) {
        var x = PIANO_KEY_W + s * colW;
        ctx.strokeStyle = (s % 4 === 0) ? '#444444' : '#1b1b1b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      if (isPlaying) {
        var px = PIANO_KEY_W + activePlayStep * colW;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fillRect(px, 0, colW, h);
      }

      var canTie = (inst.id === 'bassline');
      for (var st = 0; st < STEPS; st++) {
        if (!track.steps[st]) continue;
        var nIdx = track.notes[st];
        if (nIdx < 0 || nIdx >= numRows) nIdx = 0;
        var rowFromTop = (numRows - 1) - nIdx;

        var tiedLeft = canTie && (st > 0 && track.steps[st - 1] && track.tied[st] && track.notes[st - 1] === nIdx);
        var tiedRight = canTie && (st + 1 < STEPS && track.steps[st + 1] && track.tied[st + 1] && track.notes[st + 1] === nIdx);

        var padL = tiedLeft ? 0 : 1.5;
        var padR = tiedRight ? 0 : 1.5;
        var nx = PIANO_KEY_W + st * colW + padL;
        var ny = rowFromTop * rowH + 1.5;
        var nw = Math.max(4, colW - padL - padR);
        var nh = Math.max(4, rowH - 3);

        ctx.fillStyle = (isPlaying && st === activePlayStep) ? '#ffffff' : '#dddddd';
        ctx.fillRect(nx, ny, nw, nh);
      }

      if (isPlaying) {
        var lineX = PIANO_KEY_W + activePlayStep * colW;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, h);
        ctx.stroke();
      }
    }

    // ---------------------------------------------------------
    // STANDARD STEP GRID (DRUMS)
    // ---------------------------------------------------------
    function paintStepPad(stepIdx, state) {
      tracks[turnIndex].steps[stepIdx] = state;
      var pad = stepGrid.querySelector('.step-pad[data-step="' + stepIdx + '"]');
      if (pad) pad.classList.toggle('active', state);
    }

    function buildStepGrid() {
      stepGrid.innerHTML = '';
      for (var i = 0; i < STEPS; i++) {
        (function(stepIdx) {
          var wrap = document.createElement('div');
          wrap.className = 'step-wrap';

          var pad = document.createElement('button');
          pad.type = 'button';
          pad.className = 'step-pad mono' + (stepIdx % 4 === 0 ? ' beat-mark' : '');
          pad.setAttribute('data-step', stepIdx);
          pad.textContent = stepIdx + 1;

          var bar = document.createElement('div');
          bar.className = 'playhead-bar';

          pad.addEventListener('pointerdown', function(e) {
            if (gameMode === 'online' && !isMyTurn()) return;
            e.preventDefault();
            ensureAudioUnlocked();
            dragPointerId = e.pointerId;
            dragPaint = !tracks[turnIndex].steps[stepIdx];
            paintStepPad(stepIdx, dragPaint);
          });

          wrap.appendChild(pad);
          wrap.appendChild(bar);
          stepGrid.appendChild(wrap);
        })(i);
      }
    }
    buildStepGrid();

    window.addEventListener('pointermove', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;

      if (pianoPointerId !== null && e.pointerId === pianoPointerId) {
        var cell = getPianoCellAt(e.clientX, e.clientY);
        var instId = INSTRUMENTS[turnIndex].id;
        var track = tracks[turnIndex];

        if (pianoDrawMode === 'erase') {
          var loE = Math.min(pianoLastStep, cell.step);
          var hiE = Math.max(pianoLastStep, cell.step);
          var changedE = false;
          for (var ek = loE; ek <= hiE; ek++) {
            if (track.steps[ek] || track.tied[ek]) {
              track.steps[ek] = false;
              track.tied[ek] = false;
              changedE = true;
            }
          }
          untieIfNeeded(track, hiE);
          pianoLastStep = cell.step;
          if (changedE) drawPianoRoll();
          return;
        }

        if (instId === 'synth') {
          var loS = Math.min(pianoLastStep, cell.step);
          var hiS = Math.max(pianoLastStep, cell.step);
          var changedS = false;
          for (var sk = loS; sk <= hiS; sk++) {
            if (!track.steps[sk] || track.notes[sk] !== cell.noteIdx || track.tied[sk]) {
              track.steps[sk] = true;
              track.notes[sk] = cell.noteIdx;
              track.tied[sk] = false;
              changedS = true;
            }
          }
          pianoLastStep = cell.step;
          if (changedS) drawPianoRoll();
          return;
        }

        if (cell.step === pianoLastStep) {
          if (!pianoMovedHoriz && track.notes[cell.step] !== cell.noteIdx) {
            track.steps[cell.step] = true;
            track.notes[cell.step] = cell.noteIdx;
            track.tied[cell.step] = false;
            pianoAnchorNote = cell.noteIdx;
            untieIfNeeded(track, cell.step);
            drawPianoRoll();
          }
          return;
        }

        pianoMovedHoriz = true;
        var dir = cell.step > pianoLastStep ? 1 : -1;

        if (cell.noteIdx === pianoAnchorNote) {
          var k = pianoLastStep;
          while (k !== cell.step) {
            k += dir;
            track.steps[k] = true;
            track.notes[k] = pianoAnchorNote;
          }
          var runStart = Math.min(pianoLastStep, cell.step);
          while (runStart > 0 && track.steps[runStart - 1] && track.notes[runStart - 1] === pianoAnchorNote && track.tied[runStart]) {
            runStart--;
          }
          var runEnd = Math.max(pianoLastStep, cell.step);
          for (var r = runStart + 1; r <= runEnd; r++) {
            track.tied[r] = true;
          }
          untieIfNeeded(track, runEnd);
        } else {
          track.steps[cell.step] = true;
          track.notes[cell.step] = cell.noteIdx;
          track.tied[cell.step] = false;
          pianoAnchorNote = cell.noteIdx;
          untieIfNeeded(track, cell.step);
        }

        pianoLastStep = cell.step;
        drawPianoRoll();
        return;
      }

      if (dragPointerId === null || e.pointerId !== dragPointerId) return;
      if (isPianoRollInstrument(INSTRUMENTS[turnIndex].id)) return;
      var hitEl = document.elementFromPoint(e.clientX, e.clientY);
      if (hitEl && hitEl.classList && hitEl.classList.contains('step-pad')) {
        var s = Number(hitEl.getAttribute('data-step'));
        if (!isNaN(s) && tracks[turnIndex].steps[s] !== dragPaint) {
          paintStepPad(s, dragPaint);
        }
      }
    });

    function handlePointerRelease(e) {
      if (e.pointerId === dragPointerId) dragPointerId = null;
      if (e.pointerId === pianoPointerId) pianoPointerId = null;
      if (e.pointerId === leftPointerId) { leftPointerId = null; setRewind(false); }
      if (e.pointerId === rightPointerId) { rightPointerId = null; setHighPass(false); }
    }

    window.addEventListener('pointerup', handlePointerRelease);
    window.addEventListener('pointercancel', handlePointerRelease);
    window.addEventListener('touchend', function(e) {
      if (e.touches && e.touches.length === 0) {
        dragPointerId = null;
        pianoPointerId = null;
        leftPointerId = null;
        rightPointerId = null;
        setRewind(false);
        setHighPass(false);
      }
    });

    leftVinyl.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      leftPointerId = e.pointerId;
      setRewind(true);
    });
    leftVinyl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    rightVinyl.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      rightPointerId = e.pointerId;
      setHighPass(true);
    });
    rightVinyl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    function renderStepPads() {
      var track = tracks[turnIndex];
      var pads = stepGrid.querySelectorAll('.step-pad');
      for (var i = 0; i < pads.length; i++) {
        pads[i].classList.toggle('active', track.steps[i]);
        pads[i].textContent = i + 1;
      }
    }

    function updateParamText() {
      var inst = INSTRUMENTS[turnIndex];
      var p = tracks[turnIndex].params;
      if (inst.id === 'bassline') {
        var st = Math.round(lerp(inst.pitchRange[0], inst.pitchRange[1], p.pitch));
        pitchVal.textContent = (st > 0 ? '+' + st : st) + ' st';
      } else if (inst.id === 'synth') {
        var oct = Math.round(p.pitch);
        pitchVal.textContent = (oct > 0 ? '+' + oct : oct) + ' oct';
      } else {
        pitchVal.textContent = Math.round(p.pitch * 100) + '%';
      }

      var rawDecay = lerp(inst.decayRange[0], inst.decayRange[1], p.decay);
      decayVal.textContent = Math.round(rawDecay * 1000) + ' ms';

      var hz = Math.round(inst.id === 'bassline' ? normToBassFilterHz(p.filter) : normToFilterHz(p.filter));
      filterVal.textContent = hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : hz + ' Hz';
    }

    function renderTurn() {
      var inst = INSTRUMENTS[turnIndex];
      var track = tracks[turnIndex];
      var isPiano = isPianoRollInstrument(inst.id);
      var isSynth = inst.id === 'synth';

      instName.textContent = inst.name;

      stepGrid.classList.toggle('hidden', isPiano);
      waveBar.classList.toggle('hidden', !isSynth);
      pianoRollWrap.classList.toggle('hidden', !isPiano);

      if (isSynth) {
        pitchLabel.textContent = 'Transpose';
        pitchSlider.min = '-1';
        pitchSlider.max = '1';
        pitchSlider.step = '1';
        renderWaveButtons();
      } else {
        pitchLabel.textContent = 'Pitch';
        pitchSlider.min = '0';
        pitchSlider.max = '1';
        pitchSlider.step = '0.01';
      }

      if (isPiano) {
        requestAnimationFrame(drawPianoRoll);
      } else {
        renderStepPads();
      }

      pitchSlider.value = track.params.pitch;
      decaySlider.value = track.params.decay;
      filterSlider.value = track.params.filter;
      updateParamText();

      if (gameMode === 'solo') {
        if (turnIndex < INSTRUMENTS.length - 1) {
          nextBtn.textContent = INSTRUMENTS[turnIndex + 1].name + ' →';
        } else {
          nextBtn.textContent = 'Play →';
        }
      } else {
        updateTurnStatusUI();
      }
    }

    bpmSlider.addEventListener('input', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;
      bpm = Number(e.target.value);
      bpmValue.textContent = bpm;
      updateParamText();
    });

    pitchSlider.addEventListener('input', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;
      tracks[turnIndex].params.pitch = parseFloat(e.target.value);
      updateParamText();
      if (isPianoRollInstrument(INSTRUMENTS[turnIndex].id)) {
        drawPianoRoll();
      }
    });

    decaySlider.addEventListener('input', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;
      tracks[turnIndex].params.decay = parseFloat(e.target.value);
      updateParamText();
    });

    filterSlider.addEventListener('input', function(e) {
      if (gameMode === 'online' && !isMyTurn()) return;
      tracks[turnIndex].params.filter = parseFloat(e.target.value);
      updateParamText();
    });

    function startGame() {
      resetTracks();
      turnIndex = 0;
      finaleActive = false;
      dragPointerId = null;
      pianoPointerId = null;

      startScreen.classList.add('hidden');
      finaleScreen.classList.add('hidden');
      sequencerScreen.classList.remove('hidden');

      renderTurn();
      startSequencer();
    }

    function nextTurn() {
      dragPointerId = null;
      pianoPointerId = null;
      if (turnIndex < INSTRUMENTS.length - 1) {
        turnIndex++;
        renderTurn();
      } else {
        startFinale();
      }
    }

    // ---------------------------------------------------------
    // DJ VINYLS & PIXEL PIGEON DANCER (FINALE)
    // ---------------------------------------------------------
    var vinylAngleL = 0;
    var vinylAngleR = 0;

    function drawVinyl(canvas, angle, isPressed) {
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;
      var cx = w / 2;
      var cy = h / 2;
      var outerR = w / 2 - 4;

      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.lineWidth = isPressed ? 2.5 : 1.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      var radii = [outerR - 9, outerR - 17, outerR - 25, outerR - 33, outerR - 41];
      for (var i = 0; i < radii.length; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, radii[i], 0, Math.PI * 2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = isPressed ? '#666666' : '#333333';
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(outerR - 5, 0);
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 17, 0, Math.PI * 2);
      ctx.fillStyle = isPressed ? '#000000' : '#ffffff';
      ctx.fill();
      if (isPressed) {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = isPressed ? '#ffffff' : '#000000';
      ctx.fill();
    }
